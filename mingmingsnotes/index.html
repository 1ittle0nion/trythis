<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>齐一鸣问答器</title>
<style>
:root{--bg:#09090a;--card:#141416;--line:#29292e;--text:#f5f5f5;--muted:#8f8f97}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#202024,transparent 34%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:840px;margin:auto;padding:34px 16px 64px} .head{display:flex;gap:14px;align-items:center;margin-bottom:28px}
.avatar{width:54px;height:54px;border-radius:15px;background:#f3f3f4;color:#111;display:grid;place-items:center;font-size:23px;font-weight:800}
.name{font-size:23px;font-weight:780} .sub{font-size:13px;color:var(--muted);margin-top:4px}
.askbox{background:#131315;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 28px 70px #0005}
textarea{width:100%;min-height:120px;border:0;outline:0;background:transparent;color:var(--text);resize:vertical;font:inherit;font-size:18px;line-height:1.7}
textarea::placeholder{color:#5e5e66} .row{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:13px}
.tip{flex:1;font-size:12px;color:#707078} button{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:720;cursor:pointer}
.primary{background:#f4f4f5;color:#101011} .secondary{background:#202024;color:#ddd;border:1px solid #303035}
.label{font-size:12px;color:var(--muted);margin:25px 2px 9px} .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:10px}
.card.top{border-color:#414149} .answer{font-size:17px;line-height:1.85;white-space:pre-wrap} .meta{font-size:11px;color:#717179;margin-top:10px}
.small{font-size:13px;color:#a7a7ae;line-height:1.7} .empty{padding:42px 10px 10px;text-align:center;color:#74747b;font-size:14px}
@media(max-width:620px){.wrap{padding-top:23px}textarea{font-size:16px}.tip{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="avatar">齐</div><div><div class="name">齐一鸣</div><div class="sub">有话就问。</div></div></div>
  <div class="askbox">
    <textarea id="q" placeholder="比如：你跟何肇华什么关系？&#10;或者：梁晃他爸是干什么的？"></textarea>
    <div class="row"><div class="tip">Enter 提问 · Shift + Enter 换行</div><button id="clear" class="secondary">清空</button><button id="ask" class="primary">问他</button></div>
  </div>
  <div id="out"><div class="empty">问吧。最好别拐弯抹角。</div></div>
</div>

function privacyHit(q){const nq=norm(q);return PRIVACY_PATTERNS.some(x=>nq.includes(norm(x)));}
function humorHit(q){const nq=norm(q);for(const item of HUMOR_PATTERNS){if(item.keys.some(k=>nq.includes(norm(k))))return pick(item.replies);}return null;}

function personAnswer(p,intent){
  if(intent==="relation") return pick(RELATION_GENERIC_REPLIES);
  const bank=PERSON_MYSTERY[p.name]||{};
  const options=bank[intent]||bank.summary;
  if(options&&options.length) return pick(options);
  return pick(UNKNOWN_REPLIES);
}

function render(){

  const q=document.getElementById("q").value.trim(), out=document.getElementById("out");
  if(!q){out.innerHTML='<div class="empty">问吧。最好别拐弯抹角。</div>';return}

  if(privacyHit(q)){
    out.innerHTML=`<div class="label">齐一鸣</div><div class="card top"><div class="answer">${esc(pick(PRIVACY_REPLIES))}</div></div>`;
    return;
  }

  const funny=humorHit(q);
  if(funny){
    out.innerHTML=`<div class="label">齐一鸣</div><div class="card top"><div class="answer">${esc(funny)}</div></div>`;
    return;
  }

  const nq0=norm(q);
  const vaguePrompt =
    nq0.includes("关于这个事") ||
    nq0.includes("这事怎么回事") ||
    nq0.includes("这个事怎么回事") ||
    nq0.includes("解释一下") ||
    nq0.includes("什么意思") ||
    nq0.includes("说两句") ||
    nq0.includes("展开说说") ||
    nq0.includes("细说");

  if(vaguePrompt){
    out.innerHTML=`<div class="label">齐一鸣</div><div class="card top"><div class="answer">${esc(pick(VAGUE_REPLIES))}</div></div>`;
    return;
  }

  const explicitlyUnanswerable =
    /[0-9一二三四五六七八九十]+号位/.test(q) ||
    nq0.includes("坐的是谁") ||
    nq0.includes("谁坐") ||
    nq0.includes("随便说点什么") ||
    nq0.includes("随便说点啥") ||
    nq0.includes("说点什么") ||
    nq0.includes("讲点什么");

  if(explicitlyUnanswerable){
    out.innerHTML=`<div class="label">齐一鸣</div><div class="card top"><div class="answer">${esc(pick(UNKNOWN_REPLIES))}</div></div>`;
    return;
  }

  const p=findPerson(q);
  if(p){
    const intent=detectIntent(q);
    out.innerHTML=`<div class="label">齐一鸣</div><div class="card top"><div class="answer">${esc(personAnswer(p,intent))}</div></div>`;
    return;
  }
  const ranked=CORE.map(x=>({...x,s:coreScore(q,x)})).sort((a,b)=>b.s-a.s),t=ranked[0];
  if(!t||t.s<.30){out.innerHTML=`<div class="label">齐一鸣</div><div class="card top"><div class="answer">${esc(pick(UNKNOWN_REPLIES))}</div></div>`;return}
  if(t.s>=.70){out.innerHTML=`<div class="label">齐一鸣</div><div class="card top"><div class="answer">${esc(pick(t.answers))}</div></div>`;return}
  const c=ranked.filter(x=>x.s>=.24).slice(0,3);
  out.innerHTML=`<div class="label">齐一鸣</div><div class="small">你问得有点含糊。我猜你可能是在问这些：</div>`+
    c.map((x,i)=>`<div class="card ${i===0?"top":""}"><div class="small">${i+1}. ${esc(x.question)}</div><div class="answer" style="margin-top:8px">${esc(pick(x.answers))}</div><div class="meta">可能性 ${Math.round(x.s*100)}%</div></div>`).join("");
}
document.getElementById("ask").onclick=render;
document.getElementById("clear").onclick=()=>{document.getElementById("q").value="";render();document.getElementById("q").focus()};
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();render()}});
</script></body></html>
