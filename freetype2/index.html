rkspace{position:relative;min-height:0;overflow:auto;display:grid;place-items:center;padding:34px 28px 110px;background:radial-gradient(circle at 50% 35%,#272b30 0,#17191c 52%,#101214 100%)}.stage{width:min(70vw,760px);height:min(calc(100dvh - 205px),900px);display:grid;place-items:center}.artboard{position:relative;width:auto;height:100%;max-width:100%;aspect-ratio:3/4;overflow:hidden;background:#ddd;box-shadow:0 25px 80px #0009;border-radius:4px;container-type:inline-size;touch-action:none;user-select:none}.grain{position:absolute;inset:0;z-index:999;pointer-events:none;opacity:.2;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E")}.layer{position:absolute;cursor:move;white-space:pre-wrap;overflow:hidden;transform-origin:center}.layer.text{display:flex;align-items:flex-start}.layer.selected{outline:1px solid #43e2b1;outline-offset:2px}.layer.selected:after{content:"";position:absolute;right:-4px;bottom:-4px;width:9px;height:9px;border-radius:50%;background:#43e2b1}.layer img{width:100%;height:100%;display:block}.dock{position:fixed;left:50%;bottom:18px;translate:-50% 0;display:flex;gap:7px;padding:8px;background:#101214e8;border:1px solid #34383d;border-radius:14px;box-shadow:0 12px 44px #0008;backdrop-filter:blur(15px);z-index:20}.dock .button{white-space:nowrap}.empty{color:#878c93;text-align:center;padding:40px 10px}.value{color:#fff}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.color-box{height:38px;width:100%;padding:2px;border:1px solid #3c4046;background:#101214;border-radius:8px}.layer-list{display:grid;gap:7px}.layer-item{display:flex;align-items:center;gap:8px;text-align:left}.layer-item span{overflow:hidden;text-overflow:ellipsis;white-space:now <body>
<div class="app">
  <header class="top"><div class="brand">排版<b>抽卡机</b></div><span class="hint">纯前端 · 自动保存在当前浏览器</span><div class="top-actions"><button class="button small hide-mobile" id="newProject">新建</button><button class="button small" id="exportPng">导出 PNG</button><button class="button small" id="exportJpg">导出 JPG</button></div></header>
  <main class="shell">

        <label class="label">正文</label><textarea id="bodyInput">留白不是空缺，而是让文字和图像各自归位。让页面保有呼吸，也保有张力。</textarea>
        <label class="label">小字（每行一组）</label><textarea id="microInput">版式抽卡机 / VOL.01
每一次生成，都遵循一套看不见的秩序
TYPE · IMAGE · GRID
留白即方法</textarea>
      </div>
      <div class="section"><label class="label">画布比例</label><div class="ratio-row" id="ratios"></div></div>
      <div class="section"><label class="label">风格预设</label><div class="style-grid" id="styles"></div></div>
      <div class="section">

      </div>
      <div class="section"><label class="label">插入图片</label><div class="upload"><label class="button" for="imageInput">选择图片</label><input id="imageInput" type="file" accept="image/*" multiple><button class="button ghost" id="clearImages">清空图片</button></div><p class="notice">图片仅保存在当前浏览器，不会上传服务器。</p></div>
      <div><label class="label">图层</label><div class="layer-list" id="layerList"></div></div>
    </aside>
    <section class="workspace"><div class="stage"><div class="artboard" id="artboard"><div class="grain" id="grain"></div></div></div></section>
    <aside class="panel right"><h2>选中图层</h2><div id="inspector"></div></aside>
  </main>
  <nav class="dock"><button class="button primary" id="fullReroll">一键全部重排</button><button class="button" id="layoutReroll">只换版式</button><button class="button" id="fontReroll">只换字体</button><button class="button" id="colorReroll">只换配色</button></nav>
</div>

  const recipes = [

  ];

  const defaults = {aspect:"3:4",style:1,bg:"#D8D0C4",fg:"#17202B",accent:"#8C6046",grain:18,selected:null,images:[],layers:[],recipe:0,copy:{title:"让白承接目光",subtitle:"SPACE WEIGHS CONTENT",body:"留白不是空缺，而是让文字和图像各自归位。让页面保有呼吸，也保有张力。",micro:["版式抽卡机 / VOL.01","每一次生成，都遵循一套看不见的秩序","TYPE · IMAGE · GRID","留白即方法"]}};
  let state;
  try{state=JSON.parse(localStorage.getItem("layout-card-machine-v1"))||structuredClone(defaults)}catch{state=structuredClone(defaults)}
  if(!state.copy) state=structuredClone(defaults);
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const different = (n,current) => {let x=current; while(n>1&&x===current)x=Math.floor(Math.random()*n); return x};
  const uid = () => Math.random().toString(36).slice(2,9);
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function copyFromInputs(){state.copy={title:$("#titleInput").value||"未命名标题",subtitle:$("#subtitleInput").value||"DESIGN HAS A RHYTHM",body:$("#bodyInput").value,micro:$("#microInput").value.split("\n").filter(Boolean).slice(0,8)}}
  function textLayer(role,text,s,font,weight,color,z){return{id:uid(),kind:"text",role,name:{title:"主标题",subtitle:"副标题",body:"正文",micro:"小字"}[role],text,x:s[0]+(Math.random()*2-1),y:s[1]+(Math.random()*2-1),w:s[2],h:s[3],size:s[4]||12,align:s[5]||"left",rot:(s[6]||0)+(Math.random()*2-1),font,weight,lh:role==="title"?.9:role==="micro"?1.35:1.15,space:role==="micro"?.08:0,color,opacity:role==="micro"?.7:1,z}}
  function generateLayout(){
    copyFromInputs(); const r=recipes[state.recipe]; const p=palettes[state.style]; const df=pick(p.display), bf=pick(p.body); const layers=[];
    layers.push(textLayer("title",state.copy.title,r[0],df,pick([400,600,700,800,900]),state.fg,30));

  function fullReroll(){state.style=different(palettes.length,state.style);state.recipe=different(recipes.length,state.recipe);applyPalette();generateLayout();toast("版式、字体、配色与位置已全部重排")}

  function renderLayers(){const el=$("#layerList");el.innerHTML="";state.layers.slice().sort((a,b)=>b.z-a.z).forEach(l=>{const b=document.createElement("button");b.className="button layer-item "+(l.id===state.selected?"active":"");b.innerHTML=`<span>${l.kind==="text"?"T":l.kind==="image"?"▧":"●"}</span><span>${escapeHtml(l.name)} · ${escapeHtml((l.text||"").slice(0,16))}</span>`;b.onclick=()=>{state.selected=l.id;render()};el.appendChild(b)})}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

    const board=$("#artboard");board.style.aspectRatio=state.aspect.replace(":","/");board.style.background=state.bg;board.querySelectorAll(".layer").forEach(n=>n.remove());

      if(l.kind==="text"){d.textContent=l.text;Object.assign(d.style,{fontFamily:`"${l.font}",sans-serif`,fontSize:`${l.size/9}cqw`,fontWeight:l.weight,lineHeight:l.lh,letterSpacing:(l.space||0)+"em",color:l.color,textAlign:l.align,justifyContent:l.align==="center"?"center":l.align==="right"?"flex-end":"flex-start"})}
      if(l.kind==="image"){const im=new Image();im.src=l.src;im.draggable=false;Object.assign(im.style,{objectFit:l.fit||"cover"});d.appendChild(im)}
      if(l.kind==="shape")d.style.background=l.color;
      d.addEventListener("pointerdown",startDrag);board.insertBefore(d,$("#grain"));
    });
    $("#grain").style.opacity=state.grain/100;$("#bgColor").value=state.bg;$("#fgColor").value=state.fg;$("#accentColor").value=state.accent;$("#grainRange").value=state.grain;$("#grainValue").textContent=state.grain+"%";
    renderRatios();renderStyles();renderLayers();renderInspector();
  }
  function renderRatios(){const el=$("#ratios");el.innerHTML="";["3:4","9:16","1:1","4:3","16:9"].forEach(a=>{const b=document.createElement("button");b.className="button small "+(a===state.aspect?"active":"");b.textContent=a;b.onclick=()=>{state.aspect=a;save();render()};el.appendChild(b)})}
  function renderStyles(){const el=$("#styles");el.innerHTML="";palettes.forEach((p,i)=>{const b=document.createElement("button");b.className="button small "+(i===state.style?"active":"");b.textContent=p.name;b.onclick=()=>{state.style=i;applyPalette();state.layers.forEach(l=>{if(l.kind==="text")l.color=l.role==="subtitle"?state.accent:state.fg;if(l.kind==="shape")l.color=state.accent});save();render()};el.appendChild(b)})}
  function renderLayers(){const el=$("#layerList");el.innerHTML="";state.layers.slice().sort((a,b)=>b.z-a.z).forEach(l=>{const b=document.createElement("button");b.className="button layer-item "+(l.id===state.selected?"active":"");b.innerHTML=`<span>${l.kind==="text"?"T":l.kind==="image"?"▧":"●"}</span><span>${escapeHtml(l.name)} · ${escapeHtml((l.text||"").slice(0,16))}</span>`;b.onclick=()=>{state.selected=l.id;render()};el.appendChild(b)})}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  function renderInspector(){const el=$("#inspector"),l=state.layers.find(x=>x.id===state.selected);if(!l){el.innerHTML='<div class="empty">点选画布中的文字、图片或色块进行调整。</div>';return}
    let h=`<div class="section"><label class="label">图层名称</label><input class="field" data-k="name" value="${escapeHtml(l.name)}"></div>`;
    if(l.kind==="text")h+=`<div class="section"><label class="label">文字内容</label><textarea data-k="text">${escapeHtml(l.text)}</textarea><label class="label">字体</label><select data-k="font">${fonts.map(f=>`<option ${f===l.font?"selected":""}>${f}</option>`).join("")}</select><div class="row"><div><label class="label">字重</label><select data-k="weight">${[300,400,500,600,700,800,900].map(n=>`<option ${n===l.weight?"selected":""}>${n}</option>`).join("")}</select></div><div><label class="label">颜色</label><input class="color-box" type="color" data-k="color" value="${l.color}"></div></div><label class="label">字号 <span>${Math.round(l.size)}</span></label><input type="range" min="8" max="190" data-k="size" value="${l.size}" style="width:100%"><label class="label">行距 <span>${l.lh}</span></label><input type="range" min="0.7" max="2.2" step=".01" data-k="lh" value="${l.lh}" style="width:100%"><label class="label">字距 <span>${l.space||0}</span></label><input type="range" min="-.12" max=".3" step=".01" data-k="space" value="${l.space||0}" style="width:100%"><label class="label">对齐</label><select data-k="align"><option ${l.align==="left"?"selected":""}>left</option><option ${l.align==="center"?"selected":""}>center</option><option ${l.align==="right"?"selected":""}>right</option></select></div>`;
    if(l.kind==="image")h+=`<div class="section"><label class="label">图片裁切</label><select data-k="fit"><option ${l.fit==="cover"?"selected":""}>cover</option><option ${l.fit==="contain"?"selected":""}>contain</option></select><label class="label">圆角</label><input type="range" min="0" max="100" data-k="radius" value="${l.radius||0}" style="width:100%"></div>`;
    if(l.kind==="shape")h+=`<div class="section"><label class="label">填充色</label><input class="color-box" type="color" data-k="color" value="${l.color}"></div>`;
    h+=`<div class="section"><div class="row">${[["x","X"],["y","Y"],["w","宽"],["h","高"]].map(([k,n])=>`<label><span class="label">${n}</span><input class="field" type="number" step=".1" data-k="${k}" value="${Math.round(l[k]*10)/10}"></label>`).join("")}</div><label class="label">旋转 <span>${Math.round(l.rot||0)}°</span></label><input type="range" min="-180" max="180" data-k="rot" value="${l.rot||0}" style="width:100%"><label class="label">透明度 <span>${Math.round(l.opacity*100)}%</span></label><input type="range" min="0" max="1" step=".01" data-k="opacity" value="${l.opacity}" style="width:100%"></div><button class="button" id="deleteLayer">删除图层</button>`;
    el.innerHTML=h;el.querySelectorAll("[data-k]").forEach(i=>i.addEventListener("input",()=>{const k=i.dataset.k;const numeric=["weight","size","lh","space","radius","x","y","w","h","rot","opacity"].includes(k);l[k]=numeric?Number(i.value):i.value;save();renderBoardOnly()}));$("#deleteLayer").onclick=()=>{state.layers=state.layers.filter(x=>x.id!==l.id);state.selected=null;save();render()};
  }
  function renderBoardOnly(){const l=state.layers.find(x=>x.id===state.selected),d=l&&document.querySelector(`[data-id="${l.id}"]`);if(!d)return;Object.assign(d.style,{left:l.x+"%",top:l.y+"%",width:l.w+"%",height:l.h+"%",transform:`rotate(${l.rot||0}deg)`,opacity:l.opacity,borderRadius:(l.radius||0)+"px"});if(l.kind==="text"){d.textContent=l.text;Object.assign(d.style,{fontFamily:`"${l.font}",sans-serif`,fontSize:`${l.size/9}cqw`,fontWeight:l.weight,lineHeight:l.lh,letterSpacing:(l.space||0)+"em",color:l.color,textAlign:l.align,justifyContent:l.align==="center"?"center":l.align==="right"?"flex-end":"flex-start"})}if(l.kind==="shape")d.style.background=l.color;if(l.kind==="image"&&d.firstChild)d.firstChild.style.objectFit=l.fit}
  let drag=null;
  function startDrag(e){e.preventDefault();const id=e.currentTarget.dataset.id,l=state.layers.find(x=>x.id===id),board=$("#artboard");state.selected=id;const rect=board.getBoundingClientRect();drag={l,sx:e.clientX,sy:e.clientY,x:l.x,y:l.y,w:rect.width,h:rect.height};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.addEventListener("pointermove",moveDrag);e.currentTarget.addEventListener("pointerup",endDrag,{once:true});renderInspector();renderLayers();e.currentTarget.classList.add("selected")}
  function moveDrag(e){if(!drag)return;drag.l.x=clamp(drag.x+(e.clientX-drag.sx)/drag.w*100,-20,110);drag.l.y=clamp(drag.y+(e.clientY-drag.sy)/drag.h*100,-20,110);renderBoardOnly()}
  function endDrag(e){e.currentTarget.removeEventListener("pointermove",moveDrag);drag=null;save();render()}
  function syncInputs(){state.copy=state.copy||defaults.copy;$("#titleInput").value=state.copy.title;$("#subtitleInput").value=state.copy.subtitle;$("#bodyInput").value=state.copy.body;$("#microInput").value=state.copy.micro.join("\n")}
  $("#fullReroll").onclick=fullReroll;$("#layoutReroll").onclick=layoutReroll;$("#fontReroll").onclick=fontReroll;$("#colorReroll").onclick=colorReroll;
  [["#bgColor","bg"],["#fgColor","fg"],["#accentColor","accent"]].forEach(([id,k])=>$(id).oninput=e=>{state[k]=e.target.value;state.layers.forEach(l=>{if(l.kind==="text")l.color=l.role==="subtitle"?state.accent:state.fg;if(l.kind==="shape")l.color=state.accent});save();render()});
  $("#grainRange").oninput=e=>{state.grain=Number(e.target.value);save();render()};
  $("#imageInput").onchange=async e=>{const files=[...e.target.files].slice(0,4);for(const f of files){state.images.push(await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)}))}generateLayout();toast("图片已加入画布")};
  $("#clearImages").onclick=()=>{state.images=[];state.layers=state.layers.filter(l=>l.kind!=="image");save();render()};
  $("#newProject").onclick=()=>{if(confirm("新建会清空当前浏览器中的这个项目，继续吗？")){state=structuredClone(defaults);syncInputs();generateLayout()}};
  async function exportImage(type){
    toast("正在生成图片…");await document.fonts.ready;const [rw,rh]=state.aspect.split(":").map(Number),W=rw>=rh?1600:1200,H=Math.round(W*rh/rw),c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle=state.bg;x.fillRect(0,0,W,H);
    for(const l of state.layers.slice().sort((a,b)=>a.z-b.z)){x.save();x.globalAlpha=l.opacity;const lx=l.x/100*W,ly=l.y/100*H,lw=l.w/100*W,lh=l.h/100*H;x.translate(lx+lw/2,ly+lh/2);x.rotate((l.rot||0)*Math.PI/180);x.translate(-lw/2,-lh/2);
      if(l.kind==="shape"){x.fillStyle=l.color;roundRect(x,0,0,lw,lh,l.radius||0);x.fill()}
      if(l.kind==="image"){const im=await loadImage(l.src);drawCover(x,im,0,0,lw,lh,l.fit||"cover")}
      if(l.kind==="text"){x.fillStyle=l.color;x.textBaseline="top";x.textAlign=l.align;x.font=`${l.weight} ${l.size/1000*W}px "${l.font}", sans-serif`;wrapText(x,l.text,l.align==="left"?0:l.align==="center"?lw/2:lw,0,lw,l.size/1000*W*l.lh,lh)}x.restore()}
    if(state.grain){const n=Math.round(W*H*state.grain/900);x.save();x.globalAlpha=.055;x.fillStyle=state.fg;for(let i=0;i<n;i++)x.fillRect(Math.random()*W,Math.random()*H,1,1);x.restore()}
    const mime=type==="jpg"?"image/jpeg":"image/png";c.toBlob(b=>{const a=document.createElement("a");a.download=`layout-${Date.now()}.${type}`;a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},mime,.94);toast("导出完成")
  }
  function loadImage(src){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src})}
  function drawCover(c,i,x,y,w,h,fit){const s=fit==="contain"?Math.min(w/i.width,h/i.height):Math.max(w/i.width,h/i.height),dw=i.width*s,dh=i.height*s;c.drawImage(i,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
  function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.roundRect(x,y,w,h,r)}
  function wrapText(c,text,x,y,maxW,lineH,maxH){const chars=[...text];let line="",yy=y;for(const ch of chars){if(ch==="\n"){c.fillText(line,x,yy);line="";yy+=lineH;continue}const test=line+ch;if(c.measureText(test).width>maxW&&line){c.fillText(line,x,yy);line=ch;yy+=lineH;if(yy+lineH>maxH)break}else line=test}if(line&&yy<=maxH)c.fillText(line,x,yy)}
  $("#exportPng").onclick=()=>exportImage("png");$("#exportJpg").onclick=()=>exportImage("jpg");
  syncInputs();if(!state.layers.length)generateLayout();else render();
})();
</script>
