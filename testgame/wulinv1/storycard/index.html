<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天门 · 弟子记事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --su:#E4E7E2;--zhi:#F3F4F0;--mo:#1B1F1D;--dai:#5C6660;
  --zhu:#B0342A;--qing:#5F8272;--jin:#8A7B4F;
  --xian:rgba(27,31,29,.14);--xian2:rgba(27,31,29,.07);
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC",sans-serif;
  --mono:"JetBrains Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--su);color:var(--mo);font-family:var(--sans);font-size:14px;line-height:1.8;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--zhu);color:var(--zhi)}
:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:34px 26px 130px}

/* head */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--xian);flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:24px;font-weight:900;margin:0;letter-spacing:.08em}
.top .sub{font-size:11.5px;color:var(--dai);font-family:var(--mono);letter-spacing:.1em;margin-top:4px}
.tg{display:flex;gap:7px;align-items:center}
.tg button{background:none;border:1px solid var(--xian);color:var(--dai);font-size:11px;padding:5px 11px;font-family:var(--mono);letter-spacing:.06em;transition:.16s}
.tg button:hover{border-color:var(--dai);color:var(--mo)}
.tg button.on{border-color:var(--zhu);color:var(--zhu);background:rgba(176,52,42,.06)}

/* disciple tabs */
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0 0}
.pick{background:var(--zhi);border:1px solid var(--xian);padding:13px 14px;text-align:left;transition:.16s;position:relative}
.pick:hover{border-color:var(--dai)}
.pick.on{border-color:var(--zhu);box-shadow:inset 2px 0 0 var(--zhu)}
.pick b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}
.pick i{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--qing);margin-top:3px}
.pick u{display:block;text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--dai);margin-top:7px}
.pick u b{display:inline;font-family:var(--mono);font-size:13px;color:var(--mo)}

/* profile */
.prof{background:var(--zhi);border:1px solid var(--xian);padding:20px 22px;margin-top:16px}
.prof .nm{font-family:var(--serif);font-size:26px;font-weight:900;letter-spacing:.06em}
.prof .rl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--qing);margin-left:11px}
.tags{margin:11px 0 0}
.tag{display:inline-block;font-size:11.5px;padding:1px 9px;border:1px solid var(--xian);color:var(--dai);margin:0 5px 5px 0;background:rgba(255,255,255,.5)}
.unsolved{font-family:var(--serif);font-size:15px;line-height:1.9;border-left:2px solid var(--jin);padding:4px 0 4px 15px;margin:14px 0 0;color:var(--mo)}
.unsolved em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--jin);display:block;margin-bottom:3px}
.sts{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid var(--xian2)}
.st{text-align:center}
.st span{display:block;font-size:10.5px;color:var(--dai)}
.st b{display:block;font-family:var(--mono);font-size:16px;font-weight:600;margin-top:1px}
.yz{margin-top:16px;padding:13px 16px;background:rgba(95,130,114,.08);border:1px solid rgba(95,130,114,.25);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.yz .l b{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.08em}
.yz .l span{display:block;font-size:11.5px;color:var(--dai);margin-top:2px}
.yz .v{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--qing)}
body.truth .yz{background:rgba(176,52,42,.07);border-color:rgba(176,52,42,.3)}
body.truth .yz .v{color:var(--zhu)}

/* journal */
.jh{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 4px;gap:12px;flex-wrap:wrap}
.jh b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.06em}
.jh span{font-family:var(--mono);font-size:10.5px;color:var(--dai);letter-spacing:.08em}
.day{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--qing);margin:24px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--xian2)}
.ent{
  display:flex;gap:13px;background:var(--zhi);border:1px solid var(--xian);
  padding:14px 16px;margin-bottom:7px;cursor:pointer;transition:.14s;align-items:flex-start;
}
.ent:hover{border-color:var(--dai)}
.ent.sel{border-color:var(--zhu);box-shadow:inset 2px 0 0 var(--zhu);background:rgba(176,52,42,.04)}
.ck{width:13px;height:13px;border:1px solid var(--dai);flex:none;margin-top:6px;transition:.14s}
.ent.sel .ck{background:var(--zhu);border-color:var(--zhu)}
.ent p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.95;flex:1}
.bg{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:1px 6px;border:1px solid var(--xian);color:var(--dai);flex:none;margin-top:5px}
.bg.bian{color:var(--zhu);border-color:rgba(176,52,42,.4)}
.shown{font-family:var(--mono);font-size:9px;color:var(--jin);flex:none;margin-top:6px}
.fu{display:none}
body.truth .ent.fuok{border-color:rgba(176,52,42,.45);background:rgba(176,52,42,.05)}
body.truth .ent.fuok .fu{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--zhu);flex:none;margin-top:6px}

/* show bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;background:var(--zhi);border-top:1px solid var(--mo);
  padding:14px 26px;display:none;z-index:40;
}
.bar.on{display:block}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar b{font-family:var(--serif);font-size:15px}
.bar select{font-family:inherit;font-size:13px;padding:6px 10px;background:var(--su);border:1px solid var(--xian);color:var(--mo)}
.bar .go{background:var(--mo);color:var(--su);border:0;padding:9px 20px;font-size:13.5px;letter-spacing:.1em;margin-left:auto}
.bar .cx{background:none;border:1px solid var(--xian);color:var(--dai);padding:8px 14px;font-size:12.5px}
.bar .warn{width:100%;font-size:11.5px;color:var(--zhu);margin:0}

/* truth note */
.tn{display:none;background:rgba(176,52,42,.07);border:1px solid rgba(176,52,42,.3);padding:15px 18px;margin:18px 0 0;font-size:13px;line-height:1.85}
body.truth .tn{display:block}
.tn b{color:var(--zhu)}
.tn code{font-family:var(--mono);font-size:12px;background:rgba(176,52,42,.1);padding:1px 5px}

.note{background:rgba(138,123,79,.09);border:1px solid rgba(138,123,79,.3);padding:12px 16px;font-size:12px;color:var(--dai);margin:18px 0 0;line-height:1.8}
.note b{color:var(--jin)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--mo);color:var(--su);
  padding:10px 20px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none;
}
.toast.on{opacity:1}

@media(max-width:620px){
  .wrap{padding:22px 16px 140px}
  .picks{grid-template-columns:1fr;gap:7px}
  .sts{grid-template-columns:repeat(3,1fr);gap:12px}
  .prof .nm{font-size:22px}
  .ent p{font-size:14.5px}
  .bar{padding:12px 16px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <div>
    <h1>弟子记事</h1>
    <div class="sub">青冥剑宗 · 第三日</div>
  </div>
  <div class="tg">
    <button id="reroll">重新抽取</button>
    <button id="truth">KP · 真相视角</button>
  </div>
</div>

<div class="picks" id="picks"></div>
<div id="prof"></div>

<div class="tn">
  <b>真相视角已开启（玩家看不到这一层）</b><br>
  「引重」的真名是<b>引力</b>：<code>修为×0.4 ＋ 心境×0.2 ＋ 羁绊×0.4</code>，而羁绊＝记事条数＋你对他的行动次数。<br>
  标红的那几条，是从 D1 起就埋在记事里的伏笔。玩家读过，只是当时不知道自己在读什么。
</div>

<div class="jh"><b>记事</b><span id="cnt"></span></div>
<div id="log"></div>

<div class="note"><b>原型说明</b>　数据由记事池随机抽取生成，可点「重新抽取」看不同结果。点任意一条可选中，最多三条，然后出示给其他宗门。</div>

</div>

<div class="bar" id="bar"><div class="in">
  <b>出示 <span id="n">0</span> 条</b>
  <span style="color:var(--dai);font-size:12.5px">给</span>
  <select id="to">
    <option>落霜剑派</option><option>丹霞谷</option><option>药王宗</option>
    <option>万宝行</option><option>通天商盟</option><option>玄鹤宫</option>
  </select>
  <button class="cx" id="cancel">取消</button>
  <button class="go" id="send">出示</button>
  <p class="warn">出示后对方可完整看到这几条，且无法撤回。留意有没有你不想让他看见的。</p>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ========== 记事池 ========== */
const POOL={
daily:[
{id:"d001",t:"{name}在演武场练到掌灯，剑穗磨断了一根。",c:"修行"},
{id:"d002",t:"今日晨课，{name}的剑意比昨日沉了半分，{elder}看了两眼，没说话。",c:"修行"},
{id:"d003",t:"{name}把一式基础剑法拆成七段，说要一段一段重新学。",c:"修行",f:["木讷","重诺"]},
{id:"d004",t:"{name}闭关三个时辰，出来时脸色发白，只说还差一点。",c:"修行"},
{id:"d005",t:"{name}在瀑布下站了一夜。回来后只字未提，是{other}说漏的。",c:"修行",f:["慕强"]},
{id:"d006",t:"{name}的功法卡在第三重，已经卡了半个月。今日仍是。",c:"修行",f:["自卑"]},
{id:"d007",t:"{name}偷偷改了{elder}给的运功路子，说那样更顺，被骂了一顿。",c:"修行",f:["渴望自由"]},
{id:"d008",t:"{name}练废了两柄木剑，第三柄没敢再要。",c:"修行",f:["自卑","木讷"]},
{id:"d009",t:"今日{name}第一次接住了{other}的全力一击。两人都愣了一下。",c:"修行"},
{id:"d010",t:"{name}把自己关在藏经阁一整天，抄了三十页。",c:"修行"},
{id:"d011",t:"{name}说想学别宗的路子，被{elder}打断了。",c:"修行",f:["渴望自由"]},
{id:"d012",t:"{name}练剑时走了神，划伤了手背，没跟任何人说。",c:"修行"},
{id:"d013",t:"{name}天没亮就在山道上跑，遇见挑水的杂役，替人挑了半程。",c:"修行",f:["心善"]},
{id:"d014",t:"{name}的修为涨了一线。{ta}自己似乎没察觉。",c:"修行"},
{id:"d015",t:"{name}问{elder}，什么时候才算入门。{elder}说，你早就入了。",c:"修行",f:["自卑"]},
{id:"d016",t:"{name}背功法背到子时，被巡夜的撞见，说自己只是睡不着。",c:"修行"},
{id:"d017",t:"{name}在雪地里站桩，睫毛结了霜，姿势一直没变。",c:"修行",f:["慕强"]},
{id:"d018",t:"{name}把师兄的旧剑谱翻烂了，边角都起了毛。",c:"修行"},
{id:"d019",t:"今日{name}没有练剑。谁也没问为什么。",c:"修行"},
{id:"d020",t:"{name}说昨夜梦见自己出剑很快，快到看不见。",c:"修行"},

{id:"d021",t:"{name}和{other}为一句话吵了起来，晚饭时又坐在了一起。",c:"往来"},
{id:"d022",t:"{other}病了，{name}守了半宿，第二天照常上早课。",c:"往来",f:["心善","护短"]},
{id:"d023",t:"{name}把自己那份灵果分了一半给{other}，说自己不爱吃。",c:"往来",f:["心善"]},
{id:"d024",t:"{name}和{other}三日没说话了。原因无人知晓。",c:"往来"},
{id:"d025",t:"{name}替{other}顶了罚，跪了两个时辰。",c:"往来",f:["重诺","护短"]},
{id:"d026",t:"外门弟子背后议论{name}，被{other}听见，动了手。",c:"往来"},
{id:"d027",t:"{name}教外门的小弟子握剑，教得很慢，很有耐心。",c:"往来",f:["心善","木讷"]},
{id:"d028",t:"{name}和{other}比了一场，没分胜负，两人都很高兴。",c:"往来"},
{id:"d029",t:"{name}把{other}落下的东西送了回去，什么也没说。",c:"往来"},
{id:"d030",t:"有人问{name}和{other}谁更强。{name}说，问这个做什么。",c:"往来"},
{id:"d031",t:"{name}最近总躲着{other}。",c:"往来",f:["自卑"]},
{id:"d032",t:"{other}赢了{name}一次。{name}笑着道贺，夜里去演武场练到很晚。",c:"往来",f:["慕强","自卑"]},
{id:"d033",t:"{name}替{elder}跑腿，回来时手里多了一包点心，分给了外门的孩子。",c:"往来",f:["心善"]},
{id:"d034",t:"{name}和杂役老周下了三盘棋，输了两盘。",c:"往来"},
{id:"d035",t:"{name}把自己的房间让给了新来的师弟，搬去了偏院。",c:"往来",f:["心善"]},
{id:"d036",t:"{name}说不喜欢{other}，可{other}受伤时第一个赶到的是{ta}。",c:"往来"},
{id:"d037",t:"有外门弟子求{name}指点，{name}指点了整整一下午。",c:"往来"},
{id:"d038",t:"{name}在饭堂替{other}留了位子。{other}没来。",c:"往来"},
{id:"d039",t:"{name}和{other}约好一起下山，最后谁也没去。",c:"往来"},
{id:"d040",t:"{name}把{other}的错处替{ta}瞒了下来。{elder}似乎知道。",c:"往来",f:["护短"]},
{id:"d041",t:"门中传言{name}与{other}不合。两人听说后都笑了。",c:"往来"},
{id:"d042",t:"{name}给外门的师妹编了个新剑穗，说是随手做的。",c:"往来",f:["心善"]},

{id:"d043",t:"今日大雨，{name}把伞给了外门师妹，自己淋着回来。",c:"性情",f:["心善"]},
{id:"d044",t:"{name}把你上月赏的剑穗拆了，重新编过，说原来那个太扎眼。",c:"性情",f:["自卑","渴望自由"]},
{id:"d045",t:"{name}捡了只断腿的雀儿，养在袖子里，一天喂三回。",c:"性情",f:["心善"]},
{id:"d046",t:"{name}不吃甜的。有人问起，{ta}说小时候吃够了。",c:"性情",f:["身世成谜"]},
{id:"d047",t:"{name}写字很慢，一笔一画，像怕写错。",c:"性情",f:["木讷","自卑"]},
{id:"d048",t:"{name}的房里没有多余的东西，干净得像没人住。",c:"性情"},
{id:"d049",t:"{name}说话时总看着地面，只有握剑的时候才抬头。",c:"性情",f:["自卑","木讷"]},
{id:"d050",t:"{name}笑得很少。笑起来的时候，眼角有一道很浅的疤。",c:"性情",f:["身世成谜"]},
{id:"d051",t:"{name}怕水。这件事只有{other}知道。",c:"性情"},
{id:"d052",t:"{name}把攒了半年的月例全换成灵石，藏在床下。",c:"性情",f:["渴望自由","身世成谜"]},
{id:"d053",t:"{name}喜欢站在山门口看云，一看就是半个时辰。",c:"性情",f:["渴望自由"]},
{id:"d054",t:"{name}从不问别人的来历，也从不说自己的。",c:"性情",f:["身世成谜"]},
{id:"d055",t:"{name}的剑鞘上刻了一个字，被磨得看不清了。",c:"性情",f:["身世成谜"]},
{id:"d056",t:"{name}睡觉时枕着剑。{other}说{ta}从入门起就这样。",c:"性情"},
{id:"d057",t:"{name}听不得别人提「家」这个字。",c:"性情",f:["身世成谜"]},
{id:"d058",t:"{name}走路很轻，常常吓到人。",c:"性情"},
{id:"d059",t:"{name}会哼一支没人听过的调子，问起就说忘了从哪听来的。",c:"性情",f:["身世成谜"]},
{id:"d060",t:"{name}对谁都客气，客气得让人不敢靠近。",c:"性情"},
{id:"d061",t:"{name}把剩饭喂了山下的野狗，被{elder}说了句「妇人之仁」。",c:"性情",f:["心善"]},
{id:"d062",t:"{name}的袖口磨破了三次，缝了三次，不肯换新的。",c:"性情",f:["木讷"]},
{id:"d063",t:"{name}第一次拿到弟子牌那天，攥了一路，手心全是汗。",c:"性情",f:["崇拜宗主","自卑"]},
{id:"d064",t:"{name}说最喜欢的时辰是天刚亮的时候，山里没有人。",c:"性情",f:["渴望自由"]},
{id:"d065",t:"{name}不会说谎。这既是{ta}最好的地方，也是最麻烦的地方。",c:"性情",f:["木讷","重诺"]},
{id:"d066",t:"{name}把一封没写完的信烧了。",c:"性情",f:["身世成谜"]},
{id:"d067",t:"{name}最近瘦了。问起来说是天热。",c:"性情"},

{id:"d068",t:"{name}在议事厅外站了很久，最终什么也没说就走了。",c:"宗主"},
{id:"d069",t:"{name}问了你一个很奇怪的问题。你当时没在意。",c:"宗主"},
{id:"d070",t:"{name}把你随口夸过的那一式练了三百遍。",c:"宗主",f:["崇拜宗主","慕强"]},
{id:"d071",t:"{name}说，掌门若有一日不要{ta}了，{ta}就回山下去。",c:"宗主",f:["自卑"]},
{id:"d072",t:"你路过演武场，{name}停下行了个礼。礼很规矩，也很生分。",c:"宗主"},
{id:"d073",t:"{name}替你挡了一句难听的话。你不在场，是别人说的。",c:"宗主",f:["护短","崇拜宗主"]},
{id:"d074",t:"{name}记得你说过的每一句话。这件事你今天才发现。",c:"宗主",f:["崇拜宗主"]},
{id:"d075",t:"{name}问你，弟子当到什么份上，才算没辜负师门。",c:"宗主",f:["重诺"]},

/* ========== 弟子 ========== */
const DISC=[
 {id:0,nm:"沈砚",role:"首徒",ta:"他",tags:["慕强","重诺","沉默"],
  st:{修为:68,资质:74,忠诚:81,心境:55,野心:62,伤势:1},
  unsolved:"入门时随身带着一枚不属于本宗的令牌，从不离身。",acts:9},
 {id:1,nm:"柳窈",role:"变数",ta:"她",tags:["自卑","渴望自由","身世成谜"],
  st:{修为:61,资质:79,忠诚:43,心境:38,野心:71,伤势:0},
  unsolved:"每月十五必独自下山，从不说去了哪里。",acts:4},
 {id:2,nm:"阿罗",role:"素人",ta:"她",tags:["崇拜宗主","心善","木讷"],
  st:{修为:29,资质:66,忠诚:70,心境:72,野心:20,伤势:0},
  unsolved:"三年前山下那场火，她是唯一活着回来的。",acts:12}
];
const ELDER="谢无咎";
const DAYS=["第一日","第二日","第三日"];
const PER=[4,3,3];

/* ========== 生成 ========== */
let seed=20260729, cur=0, sel=[], shown={};
function rnd(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return((seed>>>0)/4294967296)}
function fill(t,d){
  const o=DISC.filter(x=>x.id!==d.id)[Math.floor(rnd()*2)];
  return t.replace(/\{name\}/g,d.nm).replace(/\{ta\}/g,d.ta)
          .replace(/\{other\}/g,o.nm).replace(/\{elder\}/g,ELDER);
}
function gen(d){
  const fits=POOL.daily.filter(e=>!e.f||e.f.some(x=>d.tags.includes(x)));
  const rest=POOL.daily.filter(e=>!fits.includes(e));
  const log=[];const used={};
  DAYS.forEach((dn,di)=>{
    const items=[];
    for(let i=0;i<PER[di];i++){
      // 三成从贴合标签的池子里抽，保证角色感；伏笔单独控频
      let pool = rnd()<0.55 ? fits : rest;
      let pick,guard=0;
      do{ pick=pool[Math.floor(rnd()*pool.length)]; guard++ }while(pick&&used[pick.id]&&guard<40);
      if(!pick) continue;
      used[pick.id]=1;
      items.push({id:pick.id,t:fill(pick.t,d),fu:!!pick.fu,kind:"日常"});
    }
    // 每人每局约插入一条变故
    if(di===1&&d.id!==2 || di===2&&d.id===2){
      const inc=POOL.incident[Math.floor(rnd()*POOL.incident.length)];
      items.push({id:inc.id,t:fill(inc.t,d),fu:false,kind:"变故",n:inc.n});
    }
    log.push({day:dn,items});
  });
  return log;
}
let LOGS=DISC.map(gen);

/* ========== 渲染 ========== */
const $=s=>document.querySelector(s);
function yinzhong(d,log){
  const n=log.reduce((a,b)=>a+b.items.length,0);
  const jiban=n*2+d.acts;
  return{n,jiban,v:Math.round(d.st.修为*0.4+d.st.心境*0.2+jiban*0.4)};
}
function draw(){
  const d=DISC[cur],log=LOGS[cur],y=yinzhong(d,log);

  $('#picks').innerHTML=DISC.map((x,i)=>{
    const yy=yinzhong(x,LOGS[i]);
    return `<button class="pick ${i===cur?'on':''}" data-p="${i}">
      <b>${x.nm}</b><i>${x.role}</i>
      <u>引重 <b>${yy.v}</b>　记事 ${yy.n} 条</u></button>`;
  }).join('');

  $('#prof').innerHTML=`<div class="prof">
    <span class="nm">${d.nm}</span><span class="rl">${d.role}</span>
    <div class="tags">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <div class="unsolved"><em>一件未解之事</em>${d.unsolved}</div>
    <div class="sts">${Object.entries(d.st).map(([k,v])=>
      `<div class="st"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
    <div class="yz">
      <div class="l"><b id="yzn">引重</b><span id="yzd">此子在天门前为你增添的分量</span></div>
      <div class="v">${y.v}</div>
    </div>
  </div>`;
  if(document.body.classList.contains('truth')){
    $('#yzn').textContent='引力';
    $('#yzd').textContent=`修为 ${d.st.修为}×0.4 ＋ 心境 ${d.st.心境}×0.2 ＋ 羁绊 ${y.jiban}×0.4`;
  }

  $('#cnt').textContent=`共 ${y.n} 条　已选 ${sel.length}/3`;
  $('#log').innerHTML=log.map(g=>`
    <div class="day">${g.day}</div>
    ${g.items.map(it=>{
      const k=cur+'|'+it.id;
      return `<div class="ent ${sel.includes(k)?'sel':''} ${it.fu?'fuok':''}" data-k="${k}">
        <div class="ck"></div>
        <p>${it.t}</p>
        ${it.kind==='变故'?`<span class="bg bian">变故 · ${it.n}</span>`:''}
        ${shown[k]?`<span class="shown">已出示 ${shown[k]}</span>`:''}
        <span class="fu">伏笔</span>
      </div>`}).join('')}`).join('');

  $('#bar').classList.toggle('on',sel.length>0);
  $('#n').textContent=sel.length;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

document.addEventListener('click',e=>{
  const p=e.target.closest('[data-p]');
  if(p){cur=+p.dataset.p;sel=[];draw();return}
  const en=e.target.closest('[data-k]');
  if(en){
    const k=en.dataset.k,i=sel.indexOf(k);
    if(i>=0) sel.splice(i,1);
    else if(sel.length>=3){toast('一次最多出示三条');return}
    else sel.push(k);
    draw();return;
  }
  if(e.target.id==='cancel'){sel=[];draw();return}
  if(e.target.id==='send'){
    const to=$('#to').value;
    sel.forEach(k=>shown[k]=to);
    toast(`已向${to}出示 ${sel.length} 条，无法撤回`);
    sel=[];draw();return;
  }
  if(e.target.id==='reroll'){seed=Date.now()&0x7fffffff;LOGS=DISC.map(gen);sel=[];draw();return}
  if(e.target.id==='truth'){
    document.body.classList.toggle('truth');
    e.target.classList.toggle('on');
    draw();return;
  }
});
draw();
</script>
