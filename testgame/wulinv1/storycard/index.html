<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天门 · 弟子名册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --su:#E4E7E2;--zhi:#F3F4F0;--mo:#1B1F1D;--dai:#5C6660;
  --zhu:#B0342A;--qing:#5F8272;--jin:#8A7B4F;
  --xian:rgba(27,31,29,.14);--xian2:rgba(27,31,29,.07);
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC",sans-serif;
  --mono:"JetBrains Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--su);color:var(--mo);font-family:var(--sans);font-size:14px;line-height:1.8;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--zhu);color:var(--zhi)}
:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
.wrap{max-width:800px;margin:0 auto;padding:30px 24px 130px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--xian);flex-wrap:wrap}
.top h1{font-family:var(--serif);font-size:23px;font-weight:900;margin:0;letter-spacing:.1em}
.top .sub{font-size:11px;color:var(--dai);font-family:var(--mono);letter-spacing:.1em;margin-top:3px}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tg button{background:none;border:1px solid var(--xian);color:var(--dai);font-size:11px;padding:5px 10px;font-family:var(--mono);letter-spacing:.05em;transition:.16s}
.tg button:hover{border-color:var(--dai);color:var(--mo)}
.tg button.on{border-color:var(--zhu);color:var(--zhu);background:rgba(176,52,42,.06)}

/* 道统 */
.daos{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap}
.dao{background:var(--zhi);border:1px solid var(--xian);padding:5px 13px;font-size:12.5px;color:var(--dai);transition:.15s}
.dao.on{border-color:var(--mo);color:var(--mo);font-weight:500}

/* 总览 */
.sum{background:var(--zhi);border:1px solid var(--xian);padding:15px 18px;margin-top:14px}
.sumtop{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.sumtop .l b{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.08em}
.sumtop .l span{display:block;font-size:11px;color:var(--dai);margin-top:2px}
.sumtop .v{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1;color:var(--qing)}
.sumtop .v em{font-style:normal;font-size:12px;color:var(--dai);margin-left:4px}
.sumbar{display:flex;height:9px;margin-top:13px;background:var(--xian2);overflow:hidden}
.sumbar i{display:block;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.sumleg{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap;font-size:11.5px;color:var(--dai)}
.sumleg span{display:flex;align-items:center;gap:6px}
.sumleg u{width:8px;height:8px;text-decoration:none;flex:none}
.sumleg b{font-family:var(--mono);font-size:12px;color:var(--mo);font-weight:600}
.thr{margin-top:11px;padding-top:10px;border-top:1px solid var(--xian2);font-size:11.5px;color:var(--dai);font-family:var(--mono)}
body.truth .sum{background:rgba(176,52,42,.06);border-color:rgba(176,52,42,.28)}
body.truth .sumtop .v{color:var(--zhu)}
body.truth .thr{color:var(--zhu)}

/* 小人卡 */
.crew{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.man{background:var(--zhi);border:1px solid var(--xian);padding:12px 8px 13px;text-align:center;transition:.16s;position:relative}
.man:hover{border-color:var(--dai)}
.man.on{border-color:var(--zhu);box-shadow:inset 0 2px 0 var(--zhu)}
.man svg{width:100%;max-width:104px;height:auto;display:block;margin:0 auto}
.man b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;margin-top:6px}
.man i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--qing);margin-top:2px}
.man u{display:block;text-decoration:none;font-family:var(--mono);font-size:10.5px;color:var(--dai);margin-top:6px}
.man u b{display:inline;font-size:12.5px;color:var(--mo)}

/* profile */
.prof{background:var(--zhi);border:1px solid var(--xian);padding:20px 22px;margin-top:14px}
.ph{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.ph .big{flex:none;width:118px}
.ph .big svg{width:118px;height:auto;display:block}
.ph .info{flex:1;min-width:210px}
.nmrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nm{font-family:var(--serif);font-size:27px;font-weight:900;letter-spacing:.06em;border-bottom:1px dashed transparent;cursor:text;padding:0 2px}
.nm:hover{border-bottom-color:var(--dai)}
.nm:focus{outline:none;border-bottom-color:var(--zhu)}
.rl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--qing)}
.editnote{font-size:10.5px;color:var(--dai);font-family:var(--mono)}
.unsolved{font-family:var(--serif);font-size:14.5px;line-height:1.9;border-left:2px solid var(--jin);padding:3px 0 3px 14px;margin:12px 0 0}
.unsolved em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--jin);display:block}

.tagrow{margin:14px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.chip{border:1px solid var(--xian);background:rgba(255,255,255,.55);padding:5px 10px;text-align:left;max-width:230px}
.chip b{display:block;font-size:12.5px;font-weight:600}
.chip span{display:block;font-size:10.5px;color:var(--dai);line-height:1.55;margin-top:1px}
.chip.t性情{border-left:2px solid var(--qing)}
.chip.t天赋{border-left:2px solid var(--jin)}
.chip.t出身{border-left:2px solid #4E6480}
.chip.t心结{border-left:2px solid var(--zhu)}
.chip.t缘法{border-left:2px solid #7A5A80}
.addtag{border:1px dashed var(--dai);background:none;color:var(--dai);padding:5px 12px;font-size:12px}

.sts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px;padding-top:15px;border-top:1px solid var(--xian2)}
.st{text-align:center}
.st span{display:block;font-size:10px;color:var(--dai)}
.st b{display:block;font-family:var(--mono);font-size:15px;font-weight:600}
.st em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--qing)}

.yz{margin-top:15px;padding:13px 16px;background:rgba(95,130,114,.08);border:1px solid rgba(95,130,114,.25);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.yz .l b{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.08em}
.yz .l span{display:block;font-size:11px;color:var(--dai);margin-top:2px;font-family:var(--mono)}
.yz .v{font-family:var(--mono);font-size:25px;font-weight:600;color:var(--qing)}
body.truth .yz{background:rgba(176,52,42,.07);border-color:rgba(176,52,42,.3)}
body.truth .yz .v{color:var(--zhu)}

/* journal */
.jh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 2px;gap:10px;flex-wrap:wrap}
.jh b{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.06em}
.jh span{font-family:var(--mono);font-size:10px;color:var(--dai)}
.day{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--qing);margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--xian2)}
.ent{display:flex;gap:12px;background:var(--zhi);border:1px solid var(--xian);padding:13px 15px;margin-bottom:6px;cursor:pointer;transition:.14s;align-items:flex-start}
.ent:hover{border-color:var(--dai)}
.ent.sel{border-color:var(--zhu);box-shadow:inset 2px 0 0 var(--zhu);background:rgba(176,52,42,.04)}
.ck{width:12px;height:12px;border:1px solid var(--dai);flex:none;margin-top:6px}
.ent.sel .ck{background:var(--zhu);border-color:var(--zhu)}
.ent p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.95;flex:1}
.bg{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;padding:1px 5px;border:1px solid var(--xian);color:var(--dai);flex:none;margin-top:5px}
.bg.bian{color:var(--zhu);border-color:rgba(176,52,42,.4)}
.bg.dao{color:var(--jin);border-color:rgba(138,123,79,.4)}
.shown{font-family:var(--mono);font-size:8.5px;color:var(--jin);flex:none;margin-top:6px}
.fu{display:none}
body.truth .ent.fuok{border-color:rgba(176,52,42,.45);background:rgba(176,52,42,.05)}
body.truth .ent.fuok .fu{display:block;font-family:var(--mono);font-size:8.5px;color:var(--zhu);flex:none;margin-top:6px}

.tn{display:none;background:rgba(176,52,42,.07);border:1px solid rgba(176,52,42,.3);padding:14px 17px;margin:16px 0 0;font-size:12.5px;line-height:1.85}
body.truth .tn{display:block}
.tn b{color:var(--zhu)}
.tn code{font-family:var(--mono);font-size:11.5px;background:rgba(176,52,42,.1);padding:1px 4px}
.note{background:rgba(138,123,79,.09);border:1px solid rgba(138,123,79,.3);padding:11px 15px;font-size:11.5px;color:var(--dai);margin:16px 0 0;line-height:1.8}
.note b{color:var(--jin)}

/* bars & modal */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--zhi);border-top:1px solid var(--mo);padding:13px 24px;display:none;z-index:40}
.bar.on{display:block}
.bar .in{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar b{font-family:var(--serif);font-size:15px}
.bar select{font-family:inherit;font-size:13px;padding:6px 9px;background:var(--su);border:1px solid var(--xian);color:var(--mo)}
.bar .go{background:var(--mo);color:var(--su);border:0;padding:9px 18px;font-size:13px;letter-spacing:.08em;margin-left:auto}
.bar .cx{background:none;border:1px solid var(--xian);color:var(--dai);padding:8px 13px;font-size:12px}
.bar .warn{width:100%;font-size:11px;color:var(--zhu);margin:0}

.mask{position:fixed;inset:0;background:rgba(27,31,29,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.mask.on{display:flex}
.modal{background:var(--zhi);border:1px solid var(--mo);max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:24px 26px}
.modal h3{font-family:var(--serif);font-size:19px;margin:0 0 4px;font-weight:600}
.modal .mm{font-size:12px;color:var(--dai);margin:0 0 16px}
.cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--qing);margin:16px 0 7px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:6px}
.tp{border:1px solid var(--xian);background:rgba(255,255,255,.5);padding:7px 10px;text-align:left;transition:.14s}
.tp:hover{border-color:var(--dai)}
.tp.on{border-color:var(--zhu);background:rgba(176,52,42,.07);box-shadow:inset 2px 0 0 var(--zhu)}
.tp b{display:block;font-size:12.5px}
.tp span{display:block;font-size:10px;color:var(--dai);line-height:1.5;margin-top:1px}
.tp em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--zhu);display:block;margin-top:2px}
.mfoot{margin-top:20px;padding-top:14px;border-top:1px solid var(--xian);display:flex;gap:10px;align-items:center}
.mfoot .c{font-size:12px;color:var(--dai)}
.mfoot button{margin-left:auto;background:var(--mo);color:var(--su);border:0;padding:9px 20px;font-size:13px;letter-spacing:.08em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--mo);color:var(--su);padding:9px 18px;font-size:13px;z-index:70;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}

@media(max-width:640px){
  .wrap{padding:20px 14px 140px}
  .crew{grid-template-columns:repeat(3,1fr);gap:6px}
  .man{padding:9px 4px 10px}
  .man b{font-size:14px}
  .sts{grid-template-columns:repeat(3,1fr);gap:11px}
  .ph .big{width:96px;margin:0 auto}
  .ph .big svg{width:96px}
  .nm{font-size:23px}
  .chip{max-width:none;width:100%}
  .bar{padding:11px 14px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <div><h1>弟子名册</h1><div class="sub" id="sub">青冥剑宗 · 第三日</div></div>
  <div class="tg">
    <button id="reroll">重新抽取</button>
    <button id="truth">KP · 真相视角</button>
  </div>
</div>

<div class="daos" id="daos"></div>
<div id="sum"></div>
<div class="crew" id="crew"></div>
<div id="prof"></div>

<div class="tn">
  <b>真相视角（玩家看不到这一层）</b><br>
  「引重」的真名是<b>引力</b>：<code>修为×0.4 ＋ 心境×0.2 ＋ 羁绊×0.4 ＋ 标签修正</code>。羁绊＝记事条数＋你对他的行动次数。<br>
  标红的记事是从 D1 起就埋着的伏笔。另外注意标签池里的两张牌：<b>〈天门有名〉引力 +20</b>，<b>〈无根之人〉引力 −15</b>——真相揭开后，后者会变成全场最贵的东西。
</div>

<div class="jh"><b>记事</b><span id="cnt"></span></div>
<div id="log"></div>

<div class="note"><b>原型说明</b>　点小人切换弟子；点名字可直接改；点标签或「＋」可从 48 张标签池里换，每人最多三张。记事可选中最多三条出示给他宗。</div>
</div>

<div class="bar" id="bar"><div class="in">
  <b>出示 <span id="n">0</span> 条</b><span style="color:var(--dai);font-size:12px">给</span>
  <select id="to"><option>落霜剑派</option><option>丹霞谷</option><option>药王宗</option><option>万宝行</option><option>通天商盟</option><option>玄鹤宫</option></select>
  <button class="cx" id="cancel">取消</button><button class="go" id="send">出示</button>
  <p class="warn">出示后对方可完整看到，无法撤回。</p>
</div></div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 标签池 48 ================= */
const TAGS=[
{n:"慕强",c:"性情",d:"与修为高于己者切磋后，成长 +50%；对方为他宗时缘分 +1",y:0},
{n:"自卑",c:"性情",d:"受挫时心境额外 −3；被安抚时忠诚 +50%",y:0},
{n:"重诺",c:"性情",d:"立誓类事件必成功；被背叛时心境 −15",y:0},
{n:"护短",c:"性情",d:"同门受伤时忠诚 +3；私斗事件权重 ×2",y:0},
{n:"心善",c:"性情",d:"救助类成功率 +20%；被他宗拉拢的成功率 +10%",y:0},
{n:"木讷",c:"性情",d:"不受流言影响；社交类事件权重 ×0.5",y:0},
{n:"沉默",c:"性情",d:"被套话成功率 −30%；秘密不会主动外泄",y:0},
{n:"多情",c:"性情",d:"缘分成长 ×1.5；同时存在两段缘分时心境 −5",y:0},
{n:"冷淡",c:"性情",d:"心境波动减半；羁绊成长 ×0.7",y:-4},
{n:"嫉妒",c:"性情",d:"他人被专培时心境 −6；自己被专培时成长 +15%",y:0},
{n:"野心勃勃",c:"性情",d:"修为成长 +20%；忠诚每日 −1",y:0},
{n:"渴望自由",c:"性情",d:"心境每日 −1；成长 +10%；离宗类事件权重 ×2",y:0},

{n:"剑骨",c:"天赋",d:"剑道成长 +25%；出剑类事件必不失手",y:6},
{n:"灵嗅",c:"天赋",d:"丹道成长 +25%；毒物与丹毒类事件免疫",y:4},
{n:"巧手",c:"天赋",d:"器道成长 +25%；法器打造成功率 +20%",y:4},
{n:"仁心",c:"天赋",d:"医道成长 +25%；救助类事件必成功",y:4},
{n:"善贾",c:"天赋",d:"交易收益 +30%；能看出对方的真实价码",y:0},
{n:"通兽语",c:"天赋",d:"御兽成长 +25%；灵兽失控免疫",y:4},
{n:"过目不忘",c:"天赋",d:"典籍类收益 ×2；获得线索的概率 +20%",y:6},
{n:"天生道体",c:"天赋",d:"全属性成长 +10%；心境上限 +10",y:15},
{n:"早慧",c:"天赋",d:"资质上限 +10；心境上限 −10",y:6},
{n:"钝根",c:"天赋",d:"成长 −15%；但不受任何心境负面影响",y:-8},

{n:"将门之后",c:"出身",d:"战斗类事件 +10%；仇家类事件权重 ×2",y:2},
{n:"山下孤儿",c:"出身",d:"忠诚成长 ×1.5；可开启〈来历〉链",y:0},
{n:"前朝遗孤",c:"出身",d:"被他宗探查的权重 ×1.5；身负旧怨",y:10},
{n:"商贾子弟",c:"出身",d:"每日额外少量灵石；重利类事件权重 ×1.5",y:0},
{n:"妖族血脉",c:"出身",d:"成长 +20%；一旦暴露，宗门声望 −15",y:12},
{n:"散修出身",c:"出身",d:"不受门规约束（纪律类事件免疫）；忠诚成长 ×0.7",y:-4},
{n:"仇家之子",c:"出身",d:"与某一宗天然敌对；该宗对其拉拢成功率 ×2",y:0},
{n:"名门弃徒",c:"出身",d:"底蕴 +10；原宗可发起索回事件",y:4},
{n:"医家出身",c:"出身",d:"伤势恢复速度 ×2；可代行医道行动",y:0},
{n:"乐籍出身",c:"出身",d:"心境 +15；涉及声望的事件收益 −10%",y:0},

{n:"怕水",c:"心结",d:"涉水类事件必失败；此弱点可被他人利用",y:0},
{n:"不能见血",c:"心结",d:"战斗类成功率 −20%；每次见血心境 −5",y:0},
{n:"旧伤未愈",c:"心结",d:"伤势恢复 ×0.5",y:-8},
{n:"负债在身",c:"心结",d:"每日灵石流失；债主可随时索取",y:0},
{n:"要找一个人",c:"心结",d:"历练类事件线索 +30%；找到后开启大链",y:0},
{n:"畏火",c:"心结",d:"丹道与器道类成功率 −25%",y:0},
{n:"不肯杀生",c:"心结",d:"战斗必留手；不受杀戮相关心境影响",y:0},
{n:"夜不能寐",c:"心结",d:"心境每日 −2；夜间事件权重 ×2（更容易撞见东西）",y:0},

{n:"与某宗有旧",c:"缘法",d:"开局即与随机一宗存在缘分 1",y:0},
{n:"命定之敌",c:"缘法",d:"与某名弟子天然宿敌；二人切磋时双方成长 +30%",y:0},
{n:"双生",c:"缘法",d:"与他宗某弟子同源；一方陨落，另一方心境 −30",y:8},
{n:"师门恩怨",c:"缘法",d:"某位长老对其态度异常，原因未明",y:0},

let DAOX="剑";
let DISC=SETS[DAOX].disc;
let ELDER=SETS[DAOX].elder;
const DAYS=["第一日","第二日","第三日"],PER=[4,3,3];

/* ================= 小人 ================= */
function hold(k,col){
 if(k==="sword")return`<g stroke="${col}" stroke-width="2.6" fill="none"><path d="M84 62 L84 122"/><path d="M78 70 L90 70"/></g><circle cx="84" cy="58" r="2.6" fill="${col}"/>`;
 if(k==="gourd")return`<g fill="${col}"><ellipse cx="83" cy="104" rx="9" ry="11"/><ellipse cx="83" cy="90" rx="5.5" ry="6"/><rect x="81" y="80" width="4" height="5" rx="1"/></g>`;
 if(k==="hammer")return`<g fill="${col}"><rect x="80" y="70" width="16" height="11" rx="2"/><rect x="86" y="80" width="4" height="42" rx="2"/></g>`;
 if(k==="case")return`<g fill="${col}"><rect x="74" y="92" width="22" height="17" rx="2"/><path d="M81 92 v-5 h8 v5" fill="none" stroke="${col}" stroke-width="2.4"/></g>`;
 if(k==="abacus")return`<g fill="none" stroke="${col}" stroke-width="2.2"><rect x="74" y="88" width="22" height="20" rx="2"/><path d="M74 95h22M74 101h22"/></g>`;
 return`<g fill="${col}"><path d="M84 74 q-8 10 -8 20 h16 q0 -10 -8 -20z"/><circle cx="84" cy="98" r="2.6"/><rect x="82.6" y="66" width="3" height="8" rx="1.5"/></g>`;
}
function hairP(i,col){
 const H=[
  `<path d="M34 34 q0 -20 16 -20 q16 0 16 20 q-4 -12 -16 -12 q-12 0 -16 12z" fill="${col}"/><path d="M46 12 q4 -6 8 0 q-4 3 -8 0z" fill="${col}"/>`,
  `<path d="M33 36 q-1 -22 17 -22 q18 0 17 22 q-3 -14 -17 -14 q-14 0 -17 14z" fill="${col}"/><path d="M33 34 q-3 16 -1 26 l6 -2 q-3 -12 -1 -22z" fill="${col}"/><path d="M67 34 q3 16 1 26 l-6 -2 q3 -12 1 -22z" fill="${col}"/>`,
  `<path d="M34 34 q0 -20 16 -20 q16 0 16 20 q-4 -12 -16 -12 q-12 0 -16 12z" fill="${col}"/><circle cx="33" cy="24" r="6" fill="${col}"/><circle cx="67" cy="24" r="6" fill="${col}"/>`,
  `<path d="M33 36 q-1 -22 17 -22 q18 0 17 22 q-3 -14 -17 -14 q-14 0 -17 14z" fill="${col}"/><path d="M34 32 q-4 18 -2 30 l7 -3 q-4 -14 -2 -25z" fill="${col}"/>`
 ];
 return H[i%4];
}
function fig(d,glow){

 const g=glow?`<ellipse cx="50" cy="80" rx="46" ry="62" fill="#B0342A" opacity="${Math.min(.30,glow/260)}"/>`:"";
 return `<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
 ${g}
 <path d="M32 62 Q50 56 68 62 L75 138 Q50 144 25 138 Z" fill="${D.c}"/>
 <path d="M32 64 Q21 84 23 108 L33 110 Q32 86 38 68 Z" fill="${D.c}"/>
 <path d="M68 64 Q79 84 77 108 L67 110 Q68 86 62 68 Z" fill="${D.c}"/>
 <path d="M42 58 L50 74 L58 58 L54 56 L50 66 L46 56 Z" fill="${D.a}"/>
 <rect x="28" y="96" width="44" height="6" rx="1" fill="${D.a}"/>
 <path d="M25 138 Q50 144 75 138 L76 142 Q50 148 24 142 Z" fill="${D.a}"/>
 <rect x="45" y="48" width="10" height="10" fill="${skin}"/>

 ${hairP(d.hair,hairc)}

 <path d="M47 45 q3 2 6 0" stroke="${hairc}" stroke-width="1.1" fill="none" opacity=".7"/>
 ${hold(D.hold,D.a)}
 </svg>`;

/* ================= 计算 ================= */
const T=n=>TAGS.find(x=>x.n===n);
function yin(d,log){
 const n=log.reduce((a,b)=>a+b.items.length,0);
 const jb=n*2+d.acts;
 const tg=d.tags.reduce((a,x)=>a+(T(x)?T(x).y:0),0);
 return{n,jb,tg,v:Math.round(d.st.修为*.4+d.st.心境*.2+jb*.4+tg)};
}

/* ================= 生成 ================= */
let seed=20260730,cur=0,sel=[],shown={},LOGS=[];
function rnd(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return((seed>>>0)/4294967296)}
function fill(t,i){
 const d=DISC[i],o=DISC[(i+1+Math.floor(rnd()*2))%3];
 return t.replace(/\{name\}/g,d.nm).replace(/\{ta\}/g,d.ta).replace(/\{other\}/g,o.nm).replace(/\{elder\}/g,ELDER);
}
function gen(i){
 const d=DISC[i];
 const dj=DAOJI[DAOX].map(x=>({...x,dao:1}));
 const all=GEN.concat(dj);
 const fits=all.filter(e=>!e.f||e.f.some(x=>d.tags.includes(x)));
 const rest=all.filter(e=>!fits.includes(e));
 const used={},log=[];
 DAYS.forEach((dn,di)=>{
  const items=[];
  for(let k=0;k<PER[di];k++){
   const pool=rnd()<.55?fits:rest; let p,g=0;
   do{p=pool[Math.floor(rnd()*pool.length)];g++}while(p&&used[p.t]&&g<50);
   if(!p)continue; used[p.t]=1;
   items.push({id:p.t.slice(0,12)+k+di,t:fill(p.t,i),fu:!!p.fu,dao:!!p.dao,kind:"日常"});
  }
  if((di===1&&i<2)||(di===2&&i===2)){
   const c=INC[Math.floor(rnd()*INC.length)];
   items.push({id:"inc"+di+i,t:fill(c.t,i),fu:false,kind:"变故",n:c.n});
  }
  log.push({day:dn,items});
 });
 return log;
}
function regen(){LOGS=DISC.map((_,i)=>gen(i))}
regen();

/* ================= 渲染 ================= */
const $=s=>document.querySelector(s);
function draw(){
 const truth=document.body.classList.contains('truth');
 $('#sub').textContent=SETS[DAOX].sect+' · 第三日';
 const others=Object.keys(SETS).filter(k=>k!==DAOX).map(k=>SETS[k].sect)
   .concat(["落霜剑派","通天商盟","灵犀宗","万兽岭"]);
 const to=$('#to'),keep=to.value;
 to.innerHTML=others.map(s=>`<option>${s}</option>`).join('');
 if(others.includes(keep))to.value=keep;
 $('#daos').innerHTML=Object.keys(DAO).map(k=>`<button class="dao ${k===DAOX?'on':''}" data-dao="${k}">${k}道</button>`).join('');

 // ---- 综合引重 ----
 const vs=DISC.map((x,i)=>yin(x,LOGS[i]).v);
 const tot=vs.reduce((a,b)=>a+b,0);
 const REF=320, COL=truth?['#B0342A','#C4694F','#D69C86']:['#1B1F1D','#5F8272','#8A7B4F'];
 const rank=tot>=240?'第一':tot>=210?'第二':tot>=180?'第三':tot>=150?'第五':'第八';
 const pct=Math.round(tot/600*100);
 $('#sum').innerHTML=`<div class="sum">
  <div class="sumtop">
   <div class="l"><b>宗门总${truth?'引力':'引重'}</b>
    <span>${truth?'三名弟子引力合计 —— 即你手中现有的引数':'三名弟子合计，你在天门前的分量'}</span></div>
   <div class="v">${tot}<em>/ ${REF}</em></div>
  </div>
  <div class="sumbar">${vs.map((v,i)=>`<i style="width:${(v/REF*100).toFixed(1)}%;background:${COL[i]}"></i>`).join('')}</div>
  <div class="sumleg">${DISC.map((x,i)=>`<span><u style="background:${COL[i]}"></u>${x.nm} <b>${vs[i]}</b></span>`).join('')}</div>
  <div class="thr">${truth
    ? `开启天门需全场引力 ≥ 600　本宗现可提供 ${tot}（${pct}%）　贡献愈多，天门认可度愈高`
    : `分量愈重，你在天门前愈有资格　全场估位 ${rank}`}</div>
 </div>`;

 $('#crew').innerHTML=DISC.map((x,i)=>{
  const y=yin(x,LOGS[i]);
  return `<button class="man ${i===cur?'on':''}" data-p="${i}">
   ${fig(x,truth?y.v:0)}<b>${x.nm}</b><i>${x.role}</i>
   <u>引重 <b>${y.v}</b></u></button>`;
 }).join('');

 const d=DISC[cur],y=yin(d,LOGS[cur]);
 $('#prof').innerHTML=`<div class="prof"><div class="ph">
  <div class="big">${fig(d,truth?y.v:0)}</div>
  <div class="info">
   <div class="nmrow">
    <span class="nm" contenteditable="true" id="nmed">${d.nm}</span>
    <span class="rl">${d.role} · ${DAOX}道</span>
    <span class="editnote">点名字可改</span>
   </div>
   <div class="unsolved"><em>一件未解之事</em>${d.un}</div>
   <div class="tagrow">
    ${d.tags.map(t=>{const o=T(t);return `<button class="chip t${o.c}" data-edit="1"><b>${o.n}</b><span>${o.d}</span></button>`}).join('')}
    <button class="addtag" data-edit="1">＋ 换标签</button>
   </div>
  </div></div>
  <div class="sts">${Object.entries(d.st).map(([k,v])=>`<div class="st"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
  <div class="yz"><div class="l"><b>${truth?'引力':'引重'}</b>
   <span>${truth?`修为 ${d.st.修为}×0.4 ＋ 心境 ${d.st.心境}×0.2 ＋ 羁绊 ${y.jb}×0.4 ＋ 标签 ${y.tg>=0?'+':''}${y.tg}`:'此子在天门前为你增添的分量'}</span></div>
   <div class="v">${y.v}</div></div>
 </div>`;

 $('#cnt').textContent=`共 ${y.n} 条　已选 ${sel.length}/3`;
 $('#log').innerHTML=LOGS[cur].map(g=>`<div class="day">${g.day}</div>`+g.items.map(it=>{
  const k=cur+'|'+it.id;
  return `<div class="ent ${sel.includes(k)?'sel':''} ${it.fu?'fuok':''}" data-k="${k}">
   <div class="ck"></div><p>${it.t}</p>
   ${it.kind==='变故'?`<span class="bg bian">变故 · ${it.n}</span>`:it.dao?`<span class="bg dao">${DAOX}道</span>`:''}
   ${shown[k]?`<span class="shown">已出示 ${shown[k]}</span>`:''}<span class="fu">伏笔</span></div>`}).join('')).join('');

 $('#bar').classList.toggle('on',sel.length>0);
 $('#n').textContent=sel.length;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

/* 标签编辑 */
let tmp=[];
function openTags(){
 tmp=[...DISC[cur].tags];
 render();
 $('#mask').classList.add('on');
}
function render(){
 const cats=["性情","天赋","出身","心结","缘法"];
 $('#modal').innerHTML=`<h3>${DISC[cur].nm} · 标签</h3>
  <p class="mm">最多三张。标签会影响属性成长、事件权重，以及抽到哪一类记事。</p>
  ${cats.map(c=>`<div class="cat">${c}</div><div class="tgrid">
   ${TAGS.filter(t=>t.c===c).map(t=>`<button class="tp ${tmp.includes(t.n)?'on':''}" data-t="${t.n}">
     <b>${t.n}</b><span>${t.d}</span>${t.y?`<em>引力 ${t.y>0?'+':''}${t.y}</em>`:''}</button>`).join('')}
  </div>`).join('')}
  <div class="mfoot"><span class="c">已选 ${tmp.length} / 3</span><button id="okTag">确定</button></div>`;
}

document.addEventListener('click',e=>{
 const dao=e.target.closest('[data-dao]');
 if(dao){DAOX=dao.dataset.dao;DISC=SETS[DAOX].disc;ELDER=SETS[DAOX].elder;cur=0;regen();sel=[];draw();return}
 const p=e.target.closest('[data-p]');
 if(p){cur=+p.dataset.p;sel=[];draw();return}
 if(e.target.closest('[data-edit]')){openTags();return}
 const tp=e.target.closest('[data-t]');
 if(tp){
  const n=tp.dataset.t,i=tmp.indexOf(n);
  if(i>=0)tmp.splice(i,1);
  else if(tmp.length>=3){toast('最多三张标签');return}
  else tmp.push(n);
  render();return;
 }
 if(e.target.id==='okTag'){
  if(!tmp.length){toast('至少留一张');return}
  DISC[cur].tags=[...tmp];$('#mask').classList.remove('on');regen();sel=[];draw();return;
 }
 if(e.target.id==='mask'){$('#mask').classList.remove('on');return}
 const en=e.target.closest('[data-k]');
 if(en){
  const k=en.dataset.k,i=sel.indexOf(k);
  if(i>=0)sel.splice(i,1);
  else if(sel.length>=3){toast('一次最多出示三条');return}
  else sel.push(k);
  draw();return;
 }
 if(e.target.id==='cancel'){sel=[];draw();return}
 if(e.target.id==='send'){const to=$('#to').value;sel.forEach(k=>shown[k]=to);toast(`已向${to}出示 ${sel.length} 条`);sel=[];draw();return}
 if(e.target.id==='reroll'){seed=Date.now()&0x7fffffff;regen();sel=[];draw();return}
 if(e.target.id==='truth'){document.body.classList.toggle('truth');e.target.classList.toggle('on');draw();return}
});
document.addEventListener('blur',e=>{
 if(e.target.id==='nmed'){
  const v=e.target.textContent.trim().slice(0,6);
  if(v){DISC[cur].nm=v;regen();draw()}else draw();
 }
},true);
document.addEventListener('keydown',e=>{
 if(e.target.id==='nmed'&&e.key==='Enter'){e.preventDefault();e.target.blur()}
});
draw();
</script>
