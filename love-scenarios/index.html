<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2d33">
<title>像素九键手机</title>
<style>
:root{--bg1:#13272d;--bg2:#284248;--glow:#f4d58e;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 28%, #3f6463 0%, var(--bg2) 35%, var(--bg1) 100%);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
button{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0;margin:0;color:transparent;font-size:0;cursor:pointer;touch-action:manipulation;}
button:focus-visible{outline:3px solid #fff3b3;outline-offset:2px;border-radius:12px;}
.stage{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;}
.stage:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(circle at 10% 15%,#ffe39f33 0 2px,transparent 3px),radial-gradient(circle at 84% 22%,#ffe39f22 0 1.5px,transparent 2px),radial-gradient(circle at 70% 72%,#ffe39f22 0 1.5px,transparent 2px),radial-gradient(circle at 30% 86%,#ffe39f22 0 1.5px,transparent 2px);background-size:220px 220px,260px 260px,340px 340px,260px 260px;}
.stage:after{content:"";position:absolute;left:50%;bottom:-7%;transform:translateX(-50%);width:min(76vw,560px);height:180px;border-radius:50%;background:#0008;filter:blur(34px);pointer-events:none;}
.phone{position:relative;width:min(95vw,calc(95svh * 0.60),590px);aspect-ratio:971/1619;filter:drop-shadow(0 18px 26px rgba(0,0,0,.42));}
.phone-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;pointer-events:none;z-index:4;}
.screen{position:absolute;left:30.07%;top:11.06%;width:40.06%;height:32.55%;overflow:hidden;border-radius:2px;background:#111a1c;box-shadow:inset 0 0 0 3px #2e3f40,0 0 0 2px #1f1713;z-index:1;}
.screen .bg{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(10px) brightness(.55) saturate(.9);transform:scale(1.08);image-rendering:auto;}
.screen .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
.screen::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(150deg,#ffffff28,transparent 23%,transparent 64%,#fff0ca18),repeating-linear-gradient(to bottom,#f8efd214 0 1px,transparent 1px 4px);mix-blend-mode:screen;}
.screen::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 0 2px #89987aaa,inset 0 0 18px #0008;}
.screen-hit{position:absolute;left:30.07%;top:11.06%;width:40.06%;height:32.55%;z-index:10;cursor:zoom-in;}
.softkey,.nav,.numkey{position:absolute;z-index:11;border-radius:16px;}
.pressed{background:#fff2b62b;box-shadow:0 0 0 2px #fff2b655,inset 0 0 12px #fff2b655;}
.softkey.left{left:30.2%;top:46.2%;width:12.2%;height:4.5%;border-radius:20px;}
.softkey.right{left:57.7%;top:46.2%;width:12.2%;height:4.5%;border-radius:20px;}
.nav.center{left:45.4%;top:45.8%;width:9.7%;height:8.2%;border-radius:50%;}
.nav.up{left:45.6%;top:41.6%;width:9.3%;height:5.7%;border-radius:18px;}
.nav.down{left:45.6%;top:50.7%;width:9.3%;height:5.9%;border-radius:18px;}
.nav.left{left:40.5%;top:46.4%;width:5.7%;height:9.2%;border-radius:18px;}
.nav.right{left:54.8%;top:46.4%;width:5.7%;height:9.2%;border-radius:18px;}
.keypad{position:absolute;left:31.3%;top:58.0%;width:37.6%;height:24.6%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8.5% 8%;z-index:11;}
.keypad button{width:100%;height:100%;border-radius:20px;}
.viewer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,16,18,.84);z-index:30;padding:12px;}
.viewer.open{display:flex;}
.viewer-hit{position:absolute;inset:0;}
.viewer-card{position:relative;z-index:2;width:min(96vw,760px);aspect-ratio:3/4;border:4px solid #dec895;background:#0f1718;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5);}
.viewer-card img{width:100%;height:100%;object-fit:contain;background:#0c1214;image-rendering:pixelated;}
.indicators{position:absolute;left:50%;bottom:14.4%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;z-index:9;pointer-events:none;}
.indicators i{width:10px;height:10px;border-radius:3px;background:#775943;box-shadow:1px 1px 0 #0004;opacity:.55;}
.indicators i.on{background:#f0c96d;box-shadow:0 0 10px #f0c96d,1px 1px 0 #0004;opacity:1;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" role="application" aria-label="像素九键手机互动场景">
    <div class="screen">
      <img class="bg" id="screenBg" alt="">
      <img class="fg" id="screenFg" alt="互动场景">
    </div>
    <button class="screen-hit" id="screenHit" aria-label="放大查看当前画面"></button>
    <img class="phone-art" src="assets/phone.webp" alt="">

    <button class="softkey left" data-action="home" aria-label="回到第一个场景"></button>
    <button class="softkey right" data-action="zoom" aria-label="放大查看"></button>
    <button class="nav up" data-action="prev" aria-label="上一张"></button>
    <button class="nav down" data-action="next" aria-label="下一张"></button>
    <button class="nav left" data-action="prev" aria-label="上一张"></button>
    <button class="nav right" data-action="next" aria-label="下一张"></button>
    <button class="nav center" data-action="home" aria-label="回到第一个场景"></button>

    <div class="keypad" aria-label="九键场景选择">
      <button class="numkey" data-scene="1" aria-label="场景一 饺子"></button>
      <button class="numkey" data-scene="2" aria-label="场景二 跑路"></button>
      <button class="numkey" data-scene="3" aria-label="场景三 相救"></button>
      <button class="numkey" data-scene="4" aria-label="场景四 捧脸"></button>
      <button class="numkey" data-scene="5" aria-label="场景五 路灯同行"></button>
      <button class="numkey" data-scene="6" aria-label="场景六 牌桌"></button>
      <button class="numkey" data-scene="7" aria-label="场景七 醉意搀扶"></button>
      <button class="numkey" data-scene="8" aria-label="场景八 探视"></button>
      <button class="numkey" data-scene="9" aria-label="场景九 写信"></button>
    </div>

    <div class="indicators" aria-hidden="true">
      <i data-dot="1"></i><i data-dot="2"></i><i data-dot="3"></i>
      <i data-dot="4"></i><i data-dot="5"></i><i data-dot="6"></i>
      <i data-dot="7"></i><i data-dot="8"></i><i data-dot="9"></i>
    </div>
  </div>
</div>
<div class="viewer" id="viewer" aria-hidden="true">
  <button class="viewer-hit" id="viewerHit" aria-label="关闭放大"></button>
  <div class="viewer-card"><img id="viewerImg" alt="放大场景"></div>
</div>
<script>
const SCENES=[
  {id:1,src:'assets/scene1.webp'},
  {id:2,src:'assets/scene2.webp'},
  {id:3,src:'assets/scene3.webp'},
  {id:4,src:'assets/scene4.webp'},
  {id:5,src:'assets/scene5.webp'},
  {id:6,src:'assets/scene6.webp'},
  {id:7,src:'assets/scene7.webp'},
  {id:8,src:'assets/scene8.webp'},
  {id:9,src:'assets/scene9.webp'}
];
const fg=document.getElementById('screenFg');
const bg=document.getElementById('screenBg');
const viewer=document.getElementById('viewer');
const viewerImg=document.getElementById('viewerImg');
let current=0;
function preload(src){const i=new Image();i.src=src;}
SCENES.forEach(s=>preload(s.src));
function pulse(btn){if(!btn)return;btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),140);}
function updateDots(){document.querySelectorAll('.indicators i').forEach((d,i)=>d.classList.toggle('on', i===current));}
function render(){const s=SCENES[current];fg.style.opacity='0';bg.style.opacity='0';setTimeout(()=>{fg.src=s.src;bg.src=s.src;viewerImg.src=s.src;fg.style.opacity='1';bg.style.opacity='.92';updateDots();},70);}
function show(index){current=(index+SCENES.length)%SCENES.length;render();}
function showById(id){const i=SCENES.findIndex(s=>s.id===id);if(i>-1)show(i);}
function openZoom(){viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');viewerImg.src=SCENES[current].src;}
function closeZoom(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');}
function triggerAction(action){if(action==='prev')show(current-1); else if(action==='next')show(current+1); else if(action==='home')show(0); else if(action==='zoom')openZoom();}
function bindPress(el){
  let handled=false;
  const run=(ev)=>{ev.preventDefault(); handled=true; pulse(el); if(el.dataset.scene) showById(Number(el.dataset.scene)); if(el.dataset.action) triggerAction(el.dataset.action);};
  el.addEventListener('pointerdown', run);
  el.addEventListener('click', ev=>{ if(handled){handled=false; return;} run(ev); });
}
document.querySelectorAll('.numkey,.softkey,.nav').forEach(bindPress);
document.getElementById('screenHit').addEventListener('pointerdown', e=>{e.preventDefault();openZoom();});
document.getElementById('viewerHit').addEventListener('pointerdown', e=>{e.preventDefault();closeZoom();});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeZoom();return;}
  if(/^[1-9]$/.test(e.key)){e.preventDefault();showById(Number(e.key));return;}
  const actions={ArrowLeft:'prev',ArrowUp:'prev',ArrowRight:'next',ArrowDown:'next',Enter:'home',' ':'zoom',q:'home',Q:'home',w:'zoom',W:'zoom'};
  if(actions[e.key]){e.preventDefault();triggerAction(actions[e.key]);}
});
let touchStartX=null;
viewer.addEventListener('touchstart',e=>{touchStartX=e.touches[0]?.clientX??null;},{passive:true});
viewer.addEventListener('touchend',e=>{if(touchStartX===null)return; const end=e.changedTouches[0]?.clientX??touchStartX; const dx=end-touchStartX; touchStartX=null; if(Math.abs(dx)>45) show(current+(dx<0?1:-1));},{passive:true});
show(0);
</script>
</body>
</html>
