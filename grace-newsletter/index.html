-weight:980;letter-spacing:-.025em}.tag{justify-self:start;border:1.5px solid var(--ink);padding:5px 8px;background:#f7f0e4;font-size:12px;font-weight:950}.arrow{font-size:20px;font-weight:950;opacity:.55}.row:hover .arrow{opacity:1;transform:translateX(3px)}.noresult{display:none;padding:24px 8px;font-size:22px;font-weight:980}.noresult.show{display:block}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;z-index:300;background:rgba(27,24,21,.56);backdrop-filter:blur(5px)}.overlay.open{display:flex}.stack{--accent:var(--red);position:relative;width:min(950px,100%);max-height:calc(100vh - 36px);filter:drop-shadow(16px 18px 0 rgba(0,0,0,.18));animation:stackin .36s cubic-bezier(.2,.85,.2,1)}@keyframes stackin{from{transform:translateX(105px) scale(.95) rotate(1.2deg);opacity:0}to{transform:none;opacity:1}}.stack:before,.stack:after{content:"";position:absolute;inset:0;background:#ddd2c0;border:2px solid var(--ink);z-index:-2}.stack:before{transform:translate(-18px,13px) rotate(-1deg)}.stack:after{transform:translate(-34px,25px) rotate(-2deg);background:#cfc3af;z-index:-3}.foldertab{position:absolute;left:24px;top:-28px;z-index:5;min-width:190px;height:30px;padding:5px 14px 4px;background:var(--accent);color:#fffaf1;border:2px solid var(--ink);border-bottom:0;font-size:13px;font-weight:950;letter-spacing:.08em}.doc{position:relative;background:var(--paper);border:2px solid var(--ink);max-height:calc(100vh - 52px);overflow:auto}.close{position:absolute;right:12px;top:12px;z-index:4;width:42px;height:42px;border:2px solid var(--ink);background:var(--paper);box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-size:24px;font-weight:950}.dochead{display:grid;grid-template-columns:1.15fr .85fr;border-bottom:3px solid var(--ink)}.doctitle{padding:26px 28px 24px}.meta{font-size:13px;font-weight:950;letter-spacing:.14em;color:var(--muted)}.doctitle h2{margin:9px 0 0;font-size:clamp(38px,6vw,66px);line-height:.95;letter-spacing:-.055em;font-weight:980}.colorband{padding:24px 70px 24px 24px;background:var(--accent);color:#fff8ef;display:flex;flex-direction:column;justify-content:center}.colorband span{font-size:13px;font-weight:950;letter-spacing:.16em;opacity:.84}.colorband b{font-size:38px;line-height:1;margin-top:7px}.docbody{display:grid;grid-template-columns:280px 1fr;min-height:420px}.side{border-right:2px solid var(--ink);padding:28px;position:relative}.symbol{font-family:Georgia,serif;font-size:108px;line-height:1;color:var(--accent);transform:rotate(-8deg);margin-top:14px}.quick{margin-top:34px;border-top:2px solid var(--ink);padding-top:14px}.quick small{display:block;font-size:12px;font-weight:950;letter-spacing:.13em;color:var(--muted)}.quick b{display:block;font-size:34px;line-height:1.1;margin-top:7px;font-weight:980;letter-spacing:-.04em}.stamp{position:absolute;left:24px;bottom:24px;border:2px solid var(--accent);color:var(--accent);padding:6px 9px;font-size:12px;font-weight:950;transform:rotate(-5deg)}.content{padding:30px 34px 36px}.sectionlabel{font-size:13px;font-weight:950;letter-spacing:.14em;color:var(--accent);margin-bottom:10px}.content p{margin:0 0 28px;font-size:18px;line-height:1.9}.rule{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:16px 0 18px}.rule small{font-size:13px;font-weight:900;color:var(--muted)}.rule strong{display:block;font-size:30px;line-height:1.2;font-weight:980;letter-spacing:-.035em;margin-top:8px}.docfoot{border-top:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:950}
@media(max-width:780px){.wrap{width:min(100% - 22px,1160px)}.cabinet{width:min(100% - 20px,1160px);box-shadow:8px 10px 0 rgba(47,38,29,.18)}.top,.drawerarea{padding-left:12px;padding-right:12px}.searchrow{grid-template-columns:1fr}.tabs{overflow:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}.tablabel{left:10px}.drawerhead{padding-left:12px}.row{grid-template-columns:46px 1fr 78px 22px;gap:7px;padding-left:8px}.code{font-size:10px}.name{font-size:17px}.tag{font-size:10px;padding:4px 6px}.stack:before{transform:translate(-9px,8px) rotate(-1deg)}.stack:after{transform:translate(-17px,15px) rotate(-2deg)}.foldertab{left:16px;min-width:150px}.dochead{grid-template-columns:1fr}.doctitle{padding-right:60px}.colorband{min-height:78px}.docbody{grid-template-columns:1fr}.side{border-right:0;border-bottom:2px solid var(--ink);min-height:190px}.symbol{font-size:76px;margin-top:0}.quick{position:absolute;right:24px;top:32px;width:120px;border-top:0;margin-top:0}.stamp{bottom:16px}.content{padding:24px}.content p{font-size:17px}}

<body>
<header class="wrap"><div class="kicker">GRACE EVENING POST · ARCHIVE ROOM</div><h1>格雷斯今日晚报</h1><div class="headrow"><b>今日物件档案柜</b><div class="count">13 件已归档</div></div></header>
<section class="cabinet"><div class="top"><div class="searchrow"><div class="search"><input id="search" autocomplete="off" placeholder="搜索道具名称"><span class="mag">⌕</span><div class="suggest" id="suggest"></div></div><nav class="tabs"><button class="all active" data-filter="all">全部 13</button><button class="attack" data-filter="attack">攻击 06</button><button class="heal" data-filter="heal">治疗 03</button><button class="boost" data-filter="boost">加成 02</button><button class="story" data-filter="story">剧情 02</button></nav></div></div><div class="drawerarea"><div id="root"></div><div class="noresult" id="noresult">没找到这份档案。</div></div></section>
<div class="overlay" id="overlay"><div class="stack" id="stack"><div class="foldertab" id="foldertab"></div><article class="doc"><button class="close" id="close">×</button><div class="dochead"><div class="doctitle"><div class="meta" id="meta"></div><h2 id="dname"></h2></div><div class="colorband"><span id="caten"></span><b id="catcn"></b></div></div><div class="docbody"><aside class="side"><div class="symbol" id="symbol"></div><div class="quick"><small>规则摘要</small><b id="quick"></b></div><div class="stamp">已归档</div></aside><div class="content"><div class="sectionlabel">物件描述</div><p id="desc"></p><div class="rule"><small>具体效果</small><strong id="rule"></strong></div></div></div><div class="docfoot"><span id="qty"></span><span>格雷斯今日晚报 · 档案室</span></div></article></div></div>
<script>
const items=[
{id:'shotgun',cat:'attack',name:'老式猎枪',qty:'×1',tag:'攻击 +5',mark:'⌁',desc:'一把让你的攻击稳定提升 5 数值的武器。',rule:'攻击稳定 +5'},
{id:'bob-scissors',cat:'attack',name:'鲍勃的剪刀',qty:'×1',tag:'RD15',mark:'✂',desc:'这是一把真正的理发剪刀，让你的攻击提升，RD15 决定攻击数值。',rule:'RD15 决定攻击数值'},
{id:'wrench',cat:'attack',name:'扳手',qty:'×1',tag:'攻击 +3',mark:'⌁',desc:'让你的攻击稳定提升 3 数值。',rule:'攻击稳定 +3'},
{id:'pliers',cat:'attack',name:'钳子',qty:'×1',tag:'攻击 +3',mark:'⋔',desc:'让你的攻击稳定提升 3 数值。',rule:'攻击稳定 +3'},
{id:'screwdriver',cat:'attack',name:'螺丝刀',qty:'×1',tag:'攻击 +3',mark:'↟',desc:'让你的攻击稳定提升 3 数值。',rule:'攻击稳定 +3'},
{id:'angel-tip',cat:'attack',name:'铸铁天使翼尖',qty:'—',tag:'RD25',mark:'♢',desc:'也许是圣灵意志的加成，你的攻击变得飘忽而灵动，RD25 决定攻击数值。',rule:'RD25 决定攻击数值'},
{id:'bandage',cat:'heal',name:'OK绷',qty:'×1',tag:'HP +5',mark:'✚',desc:'小小的布面可以完美地贴合细小的创口，使用后恢复 5 点生命值。',rule:'恢复 5 点生命值'},
{id:'almond',cat:'heal',name:'杏仁糖',qty:'×5',tag:'HP +5',mark:'◉',desc:'用锡纸包装的小小甜蜜宇宙，使用后恢复 5 点生命值。',rule:'恢复 5 点生命值'},
{id:'rootbeer',cat:'heal',name:'冰镇A&W根啤',qty:'×2',tag:'HP +10',mark:'♨',desc:'口感极其完美的千禧年美式根啤，甜得能麻痹你的味蕾。',rule:'饮用后恢复 10 点生命值'},
{id:'fish',cat:'boost',name:'老麦克的煎腌鱼',qty:'不定',tag:'2 回合',mark:'≈',desc:'植物汁液和油脂的混合气味，吃下它，热流会让你的肌肉紧绷。',rule:'未来两回合获得攻击倍数加成'},
{id:'tequila',cat:'boost',name:'奇迹龙舌兰',qty:'×1 · 3/3',tag:'RA 运气',mark:'⚡',desc:'半瓶也许让你亢奋、也许让你晕厥的神秘液体。饮用后的结果交给运气。',rule:'未来两回合攻击 ×2，或未来两回合无法行动'},
{id:'camera',cat:'story',name:'迷你摄像机',qty:'—',tag:'用途未知',mark:'⊙',desc:'档案中暂时没有留下更多说明。',rule:'剧情物件'},
{id:'rusty-key',cat:'story',name:'锈掉的钥匙',qty:'—',tag:'KEY ITEM',mark:'⚿',desc:'也许，它可以打开格雷斯成千上万个锁中的一个。',rule:'用途未知'}];
const cats={attack:{cn:'攻击类',en:'ATTACK',file:'ATTACK FILE',color:'#b74737'},heal:{cn:'治疗类',en:'HEAL',file:'HEAL FILE',color:'#657c6e'},boost:{cn:'加成类',en:'BOOST',file:'BOOST FILE',color:'#bc8a3d'},story:{cn:'剧情类',en:'STORY',file:'STORY FILE',color:'#5e7386'}};
let filter='all';const root=document.getElementById('root'),overlay=document.getElementById('overlay'),stack=document.getElementById('stack'),search=document.getElementById('search'),suggest=document.getElementById('suggest'),noresult=document.getElementById('noresult');
function render(){root.innerHTML='';noresult.classList.remove('show');(filter==='all'?Object.keys(cats):[filter]).forEach(cat=>{const c=cats[cat],list=items.filter(i=>i.cat===cat),sec=document.createElement('section');sec.className=`drawer ${cat}`;sec.innerHTML=`<div class="tablabel">${c.en}</div><div class="drawerhead"><strong>${c.cn}</strong><span>${list.length} 件</span></div><div class="files">${list.map((i,n)=>`<div class="row ${cat}" id="row-${i.id}" data-id="${i.id}" tabindex="0"><div class="code">${String(n+1).padStart(2,'0')}</div><div class="name">${i.name}</div><div class="tag">${i.tag}</div><div class="arrow">↗</div></div>`).join('')}</div>`;root.appendChild(sec)});bind()}
function bind(){document.querySelectorAll('.row').forEach(r=>{const fn=()=>openItem(r.dataset.id,r);r.onclick=fn;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}}})}
function openItem(id,row){const i=items.find(x=>x.id===id);if(!i)return;const c=cats[i.cat],idx=items.filter(x=>x.cat===i.cat).findIndex(x=>x.id===id)+1;if(row){row.classList.add('pulling');setTimeout(()=>row.classList.remove('pulling'),520)}stack.style.setProperty('--accent',c.color);document.getElementById('foldertab').textContent=c.file;document.getElementById('meta').textContent=`${c.en} · FILE ${String(idx).padStart(2,'0')}`;document.getElementById('dname').textContent=i.name;document.getElementById('caten').textContent=c.en;document.getElementById('catcn').textContent=c.cn;document.getElementById('symbol').textContent=i.mark;document.getElementById('quick').textContent=i.tag;document.getElementById('desc').textContent=i.desc;document.getElementById('rule').textContent=i.rule;document.getElementById('qty').textContent=`数量 ${i.qty}`;setTimeout(()=>{overlay.classList.add('open');history.replaceState(null,'','#'+id)},row?180:0)}
function closeDoc(){overlay.classList.remove('open');history.replaceState(null,'',location.pathname+location.search)}document.getElementById('close').onclick=closeDoc;overlay.onclick=e=>{if(e.target===overlay)closeDoc()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDoc()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});
function matches(v){const q=v.trim().toLowerCase();return q?items.filter(i=>i.name.toLowerCase().includes(q)).slice(0,7):[]}
search.addEventListener('input',()=>{const rs=matches(search.value);suggest.innerHTML=rs.map(i=>`<button data-id="${i.id}"><span>${i.name}</span><small>${cats[i.cat].cn}</small></button>`).join('');suggest.classList.toggle('open',search.value.trim()&&rs.length);noresult.classList.toggle('show',search.value.trim()&&rs.length===0);suggest.querySelectorAll('button').forEach(b=>b.onclick=()=>locate(b.dataset.id))});search.addEventListener('keydown',e=>{if(e.key==='Enter'){const rs=matches(search.value);if(rs[0])locate(rs[0].id)}});document.addEventListener('click',e=>{if(!e.target.closest('.search'))suggest.classList.remove('open')});
function locate(id){const i=items.find(x=>x.id===id);if(!i)return;search.value=i.name;suggest.classList.remove('open');filter=i.cat;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));render();requestAnimationFrame(()=>{const r=document.getElementById('row-'+id);if(r){r.scrollIntoView({behavior:'smooth',block:'center'});r.classList.add('located');setTimeout(()=>r.classList.remove('located'),1100)}})}
render();if(location.hash){const id=location.hash.slice(1),i=items.find(x=>x.id===id);if(i){filter=i.cat;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));render();setTimeout(()=>openItem(id),100)}}
</script></body></html>
