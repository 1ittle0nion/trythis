const $=q=>document.querySelector(q);
const screen=$('#screen'),front=$('#sceneFg'),rear=$('#sceneBg'),viewer=$('#viewer'),zoomArt=$('#zoomArt');
const keys=[...document.querySelectorAll('.key')];
const cache=new Map();
let current=0;let intended=0;let sequence=0;let transitionTimers=[];
function loadScene(src){
 if(cache.has(src))return cache.get(src);
 const p=new Promise((resolve,reject)=>{
   const img=new Image();img.decoding='async';
   img.onload=()=>resolve(img);
   img.onerror=reject;
   img.src=src;
 });
 cache.set(src,p);
 return p;
}
function selectedGlow(){keys.forEach(b=>{const active=Number(b.dataset.scene)===intended+1;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));})}
function stopTransition(){transitionTimers.forEach(clearTimeout);transitionTimers=[];screen.classList.remove('switching');screen.classList.remove('loading')}
function t(fn,ms){transitionTimers.push(setTimeout(fn,ms))}
function setScene(index,{instant=false}={}){
 intended=(index+SCENES.length)%SCENES.length;
 selectedGlow();
 const call=++sequence;
 stopTransition();
 const scene=SCENES[intended];
 if(!instant && scene.src===front.getAttribute('src')){current=intended;return;}
 screen.classList.add('loading');
 loadScene(scene.src).then(()=>{
  if(call!==sequence)return;
  screen.classList.remove('loading');
  if(instant || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
   rear.src=scene.src;front.src=scene.src;zoomArt.src=scene.src;current=intended;return;
  }
  screen.classList.add('switching');
  t(()=>{
   if(call!==sequence)return;
   rear.src=scene.src;front.src=scene.src;zoomArt.src=scene.src;current=intended;
  },140);
  t(()=>{if(call===sequence)screen.classList.remove('switching')},340);
 }).catch(()=>{if(call===sequence)screen.classList.remove('loading')});
 // Lazy-load the next scene quietly; no nine-image upfront download.
 t(()=>{if(call===sequence)loadScene(SCENES[(intended+1)%SCENES.length].src).catch(()=>{})},1400);
}
function step(offset){setScene(intended+offset)}
function showZoom(){viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');zoomArt.src=SCENES[intended].src}
function hideZoom(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}
function action(btn){
 btn.classList.add('pressed');clearTimeout(btn._pulse);btn._pulse=setTimeout(()=>btn.classList.remove('pressed'),170);
 if(btn.dataset.scene){setScene(Number(btn.dataset.scene)-1);return;}
 const what=btn.dataset.action;
 if(what==='home')setScene(0);
 if(what==='prev')step(-1);
 if(what==='next')step(1);
 if(what==='zoom')showZoom();
}
// pointerdown fires immediately, including on mobile; synthetic click is not allowed to fire twice.
[...document.querySelectorAll('.key,.softkey,.nav')].forEach(btn=>{
 btn.addEventListener('pointerdown',event=>{if(event.pointerType==='mouse' && event.button!==0)return;event.preventDefault();action(btn)});
 btn.addEventListener('click',event=>{if(event.detail===0)action(btn)}); // keyboard / assistive technology
});
$('#zoomScreen').addEventListener('click',showZoom);
$('#dismissViewer').addEventListener('click',hideZoom);
$('#viewerFrame').addEventListener('click',()=>{if(skipZoomClick){skipZoomClick=false;return;}hideZoom()});
window.addEventListener('keydown',event=>{
 if(event.key==='Escape'){hideZoom();return}
 if(event.repeat)return;
 if(/^[1-9]$/.test(event.key)){
  event.preventDefault();const btn=document.querySelector(`[data-scene="${event.key}"]`);if(btn)action(btn);return;
 }
 const map={ArrowLeft:'prev',ArrowUp:'prev',ArrowRight:'next',ArrowDown:'next',Enter:'home',' ':'zoom'};
 if(map[event.key]){event.preventDefault();const btn=document.querySelector(`[data-action="${map[event.key]}"]`);if(btn)action(btn)}
});
let startX=null;let skipZoomClick=false;
$('#viewerFrame').addEventListener('touchstart',e=>{startX=e.touches[0]?.clientX??null},{passive:true});
$('#viewerFrame').addEventListener('touchend',e=>{if(startX===null)return;const dx=(e.changedTouches[0]?.clientX??startX)-startX;startX=null;if(Math.abs(dx)>48){skipZoomClick=true;step(dx<0?1:-1);setTimeout(()=>{skipZoomClick=false},350)}},{passive:true});
if(new URLSearchParams(location.search).has('debug'))document.body.classList.add('debug');
setScene(0,{instant:true});
</script>
